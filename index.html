<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cool games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=PT+Sans:wght@400;700&display=swap">
<style>
:root{
  --bg:#f6f3ec;--card:#fffdf8;--ink:#1f2433;--mute:#5d6377;--line:#e3ddcf;
  --speak:#0e8f8a;--vocab:#2f9a4a;--gram:#e0701a;--write:#2f62d6;--exam:#b8327e;
  --serif:"PT Serif",Georgia,"Times New Roman",serif;--sans:"PT Sans","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1d27;--card:#242836;--ink:#eef0f6;--mute:#a8aec2;--line:#363b4d}}
:root[data-theme="dark"]{--bg:#1a1d27;--card:#242836;--ink:#eef0f6;--mute:#a8aec2;--line:#363b4d}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 var(--sans)}
main{max-width:1180px;margin:0 auto;padding:14px 16px 28px}

/* compact top bar */
.top{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px}
h1{margin:0;font:700 26px/1 var(--serif);letter-spacing:-.3px;white-space:nowrap}
h1 span{color:var(--gram)}
.count{color:var(--mute);font-size:14px;white-space:nowrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.tab{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:6px 13px;font:700 14px var(--sans);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tab i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--ink))}
.tab[aria-pressed="true"]{background:var(--c,var(--ink));border-color:var(--c,var(--ink));color:#fff}
.tab[aria-pressed="true"] i{background:#fff}
input{width:210px;max-width:100%;padding:8px 14px;border:1.5px solid var(--line);border-radius:99px;background:var(--bg);color:var(--ink);font:15px var(--sans)}

/* activity panels */
.wall{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--card);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:14px;padding:12px 14px 14px}
.ph{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.ph h2{margin:0;font:700 20px var(--serif);color:var(--c)}
.ph b{margin-left:auto;font-size:13px;color:#fff;background:var(--c);border-radius:99px;padding:1px 9px}
.pd{margin:0 0 10px;color:var(--mute);font-size:14px}
.list{display:flex;flex-direction:column;gap:8px}
a.g{display:block;text-decoration:none;color:inherit;border-radius:10px;padding:9px 12px;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 9%,var(--card));transition:transform .12s,background .12s}
a.g:hover,a.g:focus-visible{background:color-mix(in srgb,var(--c) 18%,var(--card));transform:translateX(3px);outline:none}
.t{font:700 16.5px/1.25 var(--serif)}
.d{color:var(--mute);font-size:14px;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tags span{font-size:12px;font-weight:700;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:99px;padding:0 8px;background:var(--card)}
.none{display:none;color:var(--mute);text-align:center;padding:30px}
@media (max-width:900px){.wall{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.top{padding:10px}h1{font-size:22px}input{width:100%}.wall{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<div class="top">
  <h1>Cool <span>games</span></h1>
  <span class="count" id="cnt"></span>
  <div class="tabs" id="tabs"></div>
  <input id="q" type="search" placeholder="Поиск игры" aria-label="Поиск" autocomplete="off">
</div>
<div class="wall" id="wall"></div>
<p class="none" id="no">Ничего не найдено.</p>
</main>
<script>
var A=[
{n:"Speaking",col:0,d:"Ответы вслух, интервью, игры на скорость",c:"--speak",i:[
 ["Ten Faces, Ten Questions","10 человек задают вопросы вслух: 5 тем и ревижн Unit 1 для Габи, Redo, лист для печати","games/ten-faces.html",["интервью","на слух"]],
 ["Spotlight 11 · Module 1: Speed Game","Relationships: 20 sec finish, guess the ending, missing word, 60 sec rush","games/spotlight11-speed-game.html",["Spotlight 11","таймер","B2"]]]},
{n:"Vocabulary",col:1,d:"Слова, фразы и словообразование",c:"--vocab",i:[
 ["Word Walls","Стены со словами: собери стену, потом тест","games/word-walls.html",["стена слов"]],
 ["Spotlight 10 · Module 1: Word Walls","Teen life, Character, Appearance: собери стену, потом тест","games/word-walls-spotlight10.html",["Spotlight 10","стена слов"]],
 ["Word Formation: Team Challenge","Словообразование: 4 уровня A2–C1, 100 заданий, игра командами с таймером","games/word-formation.html",["A2–C1","команды","jeopardy"]]]},
{n:"Grammar",col:2,d:"Времена и формы глагола",c:"--gram",i:[
 ["Funny Travel Stories: Past Simple","8 смешных историй путешественников с аудио, карточки, бонус-раунд «Who told this story?»","games/funny-travel-stories.html",["Past Simple","аудио"]],
 ["60 Common Verbs: Sentence Builder","60 глаголов с фото: форма + время, Basic/Advanced, Mixed Review, лист для печати","games/sixty-verbs.html",["фото","времена"]],
 ["Rewrite: Simple Present vs Present Continuous","Перепишите предложения","games/rewrite-tenses.html",["Present Simple","Present Continuous"]]]},
{n:"Writing",col:1,d:"Ответы на сообщения и полезные фразы",c:"--write",i:[
 ["Chat Reply: Across Generations","10 чатов, карточки с озвучкой, игра «Who is replying?»","games/chat-reply.html",["чаты","стиль"]]]},
{n:"ЕГЭ",col:0,d:"Подготовка к экзамену в формате ФИПИ",c:"--exam",i:[
 ["Тренажёр «Travelling»","Задания в формате ФИПИ","games/ege-travelling.html",["ФИПИ","Travelling"]]]}
];
var cur="all",q="";
function esc(s){return s.replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function tabs(){
  var total=A.reduce(function(s,a){return s+a.i.length},0);
  document.getElementById("cnt").textContent=total+" игр";
  var h='<button class="tab" data-n="all" aria-pressed="'+(cur==="all")+'">Все</button>';
  A.forEach(function(a){h+='<button class="tab" style="--c:var('+a.c+')" data-n="'+esc(a.n)+'" aria-pressed="'+(cur===a.n)+'"><i></i>'+esc(a.n)+'</button>'});
  var t=document.getElementById("tabs");t.innerHTML=h;
  t.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){cur=b.dataset.n;tabs();draw()}});
}
function draw(){
  var cols=["","",""],n=0,sh=0,w=innerWidth>900?3:innerWidth>640?2:1;
  A.forEach(function(a,k){var h="";
    if(cur!=="all"&&cur!==a.n)return;
    var it=a.i.filter(function(x){return (x[0]+" "+x[1]+" "+x[3].join(" ")).toLowerCase().indexOf(q)>-1});
    if(!it.length)return;
    h+='<section class="panel" style="--c:var('+a.c+')"><div class="ph"><h2>'+esc(a.n)+'</h2><b>'+it.length+'</b></div><p class="pd">'+esc(a.d)+'</p><div class="list">';
    it.forEach(function(x){n++;
      h+='<a class="g" href="'+x[2]+'"><div class="t">'+esc(x[0])+'</div><div class="d">'+esc(x[1])+'</div><div class="tags">'+x[3].map(function(t){return '<span>'+esc(t)+'</span>'}).join("")+'</div></a>'});
    h+='</div></section>';
    cols[w===3&&cur==="all"&&!q?a.col:sh++%w]+=h;
  });
  document.getElementById("wall").innerHTML=cols.slice(0,w).map(function(c){return '<div class="col">'+c+'</div>'}).join("");
  document.getElementById("no").style.display=n?"none":"block";
}
document.getElementById("q").oninput=function(){q=this.value.trim().toLowerCase();draw()};
/* Always open from the very beginning: top of page, all categories, empty search. */
if("scrollRestoration" in history)history.scrollRestoration="manual";
function fresh(){cur="all";q="";document.getElementById("q").value="";tabs();draw();window.scrollTo(0,0)}
window.addEventListener("pageshow",fresh);
var rw;window.addEventListener("resize",function(){clearTimeout(rw);rw=setTimeout(draw,120)});
fresh();
</script>
</body>
</html>
