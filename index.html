<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cool games</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#14213d;--mute:#5b6784;--line:#d6deee;--blue:#2563eb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1830;--card:#18223b;--ink:#e8eefc;--mute:#9fb0d3;--line:#2c3a5e}}
:root[data-theme="dark"]{--bg:#0f1830;--card:#18223b;--ink:#e8eefc;--mute:#9fb0d3;--line:#2c3a5e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.45 "Segoe UI",system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 48px}
h1{margin:0 0 4px;font-size:30px}.sub{margin:0 0 16px;color:var(--mute)}
input{width:100%;padding:12px 16px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:12px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 16px;font:700 14px inherit;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.grp{margin-bottom:22px}.grp h2{font-size:20px;margin:0 0 4px}.grp p{margin:0 0 10px;color:var(--mute);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
a.c{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--g);border-radius:14px;padding:14px}
a.c:hover,a.c:focus-visible{border-color:var(--g);outline:2px solid transparent}
.t{font-weight:800}.d{color:var(--mute);font-size:14px;margin-top:4px}
.none{display:none;color:var(--mute)}
</style>
</head>
<body>
<main>
<h1>📁 Cool games</h1>
<p class="sub">Все игры в одном месте. Выберите категорию или начните вводить название.</p>
<input id="q" type="search" placeholder="Search games" aria-label="Поиск">
<div class="tabs" id="tabs"></div>
<div id="list"></div>
<p class="none" id="no">Nothing found.</p>
</main>
<script>
var G=[
{n:"Listening & Speaking",d:"Вопросы на слух и ответы вслух",c:"#0e9aa7",i:[
 ["Ten Faces, Ten Questions","10 человек задают вопросы вслух: 5 тем и ревижн Unit 1 для Габи, Redo, лист для печати","games/ten-faces.html"]]},
{n:"Writing & Speaking",d:"Ответы на сообщения, стиль по поколениям, полезные фразы",c:"#2563eb",i:[
 ["Chat Reply: Across Generations","10 чатов, карточки с озвучкой, игра «Who is replying?»","games/chat-reply.html"]]},
{n:"Vocabulary",d:"Слова и закрепление",c:"#059669",i:[
 ["Word Walls","Стенды со словами","games/word-walls.html"]]},
{n:"Grammar",d:"Упражнения на времена",c:"#e0701a",i:[
 ["Rewrite: Simple Present vs Present Continuous","Перепишите предложения","games/rewrite-tenses.html"]]},
{n:"Exam prep (ЕГЭ)",d:"Подготовка к экзамену",c:"#c026d3",i:[
 ["Тренажёр «Travelling» (формат ФИПИ)","Задания в формате ФИПИ","games/ege-travelling.html"]]}
];
var cur="All",q="";
function esc(s){return s.replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function tabs(){var h="";["All"].concat(G.map(function(g){return g.n})).forEach(function(n){h+='<button class="tab" aria-pressed="'+(n===cur)+'" data-n="'+esc(n)+'">'+esc(n)+'</button>'});
 var t=document.getElementById("tabs");t.innerHTML=h;t.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){cur=b.dataset.n;tabs();draw()}})}
function draw(){var h="",n=0;
 G.forEach(function(g){if(cur!=="All"&&cur!==g.n)return;
  var it=g.i.filter(function(x){return x[0].toLowerCase().indexOf(q)>-1||x[1].toLowerCase().indexOf(q)>-1});if(!it.length)return;
  h+='<section class="grp"><h2>'+esc(g.n)+'</h2><p>'+esc(g.d)+'</p><div class="grid">';
  it.forEach(function(x){n++;h+='<a class="c" style="--g:'+g.c+'" href="'+x[2]+'" ><div class="t">'+esc(x[0])+'</div><div class="d">'+esc(x[1])+'</div></a>'});
  h+='</div></section>'});
 document.getElementById("list").innerHTML=h;document.getElementById("no").style.display=n?"none":"block"}
document.getElementById("q").oninput=function(){q=this.value.trim().toLowerCase();draw()};
tabs();draw();
</script>
</body>
</html>
