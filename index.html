<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cool games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=PT+Sans:wght@400;700&display=swap">
<style>
:root{
  --bg:#f8e6d8;--page:linear-gradient(180deg,#f8e6d8 0%,#f4dccb 100%);--card:#fff8f1;--ink:#2a1f24;--mute:#6e5a5a;--line:#ecd4c2;--teal:#14a38b;
  --spot:#d64545;--speak:#e0a100;--listen:#0fa3a3;--gram:#3b6fe0;--vocab:#8b4fe0;--write:#e0701a;--exam:#c2367f;
  --serif:"PT Serif",Georgia,"Times New Roman",serif;--sans:"PT Sans","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151b26;--page:#151b26;--card:#1f2734;--ink:#eef2f8;--mute:#a7b2c4;--line:#323c4d}}
:root[data-theme="dark"]{--bg:#151b26;--page:#151b26;--card:#1f2734;--ink:#eef2f8;--mute:#a7b2c4;--line:#323c4d}
*{box-sizing:border-box}
body{margin:0;background:var(--page);background-attachment:fixed;color:var(--ink);font:16px/1.4 var(--sans)}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* 1. header */
header{background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(20,40,80,.06)}
.hd{display:flex;align-items:center;gap:20px;height:56px}
.logo{display:flex;align-items:center;gap:8px;font:700 21px var(--serif);color:var(--ink);cursor:pointer;background:none;border:0;padding:0}
.logo svg{width:28px;height:28px}
.logo span{color:var(--teal)}
nav{display:flex;gap:22px;margin:0 auto}
nav button{background:none;border:0;cursor:pointer;font-weight:700;color:var(--ink);padding:6px 0;border-bottom:2px solid transparent}
nav button.on{color:var(--teal);border-color:var(--teal)}
.count-top{color:var(--mute);font-size:14px;white-space:nowrap}
.adm{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;color:var(--mute)}
.adm:hover{background:color-mix(in srgb,var(--teal) 12%,transparent);color:var(--teal)}
.adm svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* 2. category bar */
.cats{background:color-mix(in srgb,var(--bg) 45%,var(--card));border-bottom:1px solid var(--line)}
.cb{display:flex;gap:6px;overflow-x:auto;padding:6px 16px;scrollbar-width:thin;justify-content:space-between}
.cat{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:10px;border:0;background:none;cursor:pointer;font-weight:700;white-space:nowrap;color:var(--ink)}
.cat svg{width:19px;height:19px;stroke:var(--c);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cat:hover{background:color-mix(in srgb,var(--c) 10%,transparent)}
.cat.on{background:var(--c);color:#fff}.cat.on svg{stroke:#fff}

/* 3. hero */
.hero{background:linear-gradient(110deg,#f59e3b 0%,#ec6a4f 50%,#c8417e 100%);color:#fff;text-align:center;padding:22px 16px 24px}
.hero h1{margin:0;font:700 34px/1.1 var(--serif)}
.hero p{margin:6px 0 14px;opacity:.92}
.search{max-width:640px;margin:0 auto;position:relative}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--teal);fill:none;stroke-width:2.2}
.search input{width:100%;border:0;border-radius:12px;padding:13px 16px 13px 46px;background:#fff;color:#1d2a3a;box-shadow:0 8px 24px rgba(120,30,40,.28)}

/* 4. filters */
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:16px 0 14px;box-shadow:0 2px 10px rgba(20,40,80,.05)}
select{border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--card);cursor:pointer}
.show{margin-left:auto;color:var(--mute)}.show b{color:var(--teal)}
.reset{border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--card);cursor:pointer}

/* 5. sections + cards */
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px 16px;margin-bottom:16px}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sh .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--c)}
.sh .ic svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sh h2{margin:0;font:700 21px var(--serif)}
.sh small{color:var(--mute);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
a.g{display:flex;flex-direction:column;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);transition:transform .14s,box-shadow .14s}
a.g:hover,a.g:focus-visible{transform:translateY(-3px);box-shadow:0 10px 22px rgba(20,40,80,.14);outline:none}
.pic{position:relative;aspect-ratio:16/10;background:var(--bg)}
.pic img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.new{position:absolute;right:7px;top:7px;background:#ffb020;color:#2b1d00;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px}
.lvl{position:absolute;left:7px;bottom:7px;background:rgba(20,30,50,.82);color:#fff;font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 7px}
.body{padding:8px 10px 10px;display:flex;flex-direction:column;gap:4px;flex:1}
.t{font:700 15.5px/1.22 var(--serif)}
.d{color:var(--mute);font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto;padding-top:3px}
.tags span{font-size:11.5px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);border-radius:6px;padding:1px 7px}
.none{display:none;color:var(--mute);text-align:center;padding:24px}
footer{color:var(--mute);font-size:13px;text-align:center;padding:4px 0 22px}
@media (max-width:1100px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:860px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}nav{display:none}.cb{justify-content:flex-start}}
@media (max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.hero h1{font-size:26px}.show{margin-left:0;width:100%}.count-top{display:none}}
</style>
</head>
<body>
<header><div class="wrap hd">
  <button class="logo" id="logo" aria-label="Cool games — главная">
    <svg viewBox="0 0 32 32"><rect x="2" y="2" width="28" height="28" rx="8" fill="#14a38b"/><path d="M10 12h12M10 16h8M10 20h12" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>
    Cool <span>games</span></button>
  <nav><button id="navHome" class="on">Home</button><button id="navAll">Activities</button></nav>
  <span class="count-top" id="countTop"></span>
  <a class="adm" href="admin.html" title="Управление: загрузить, изменить, удалить" aria-label="Управление"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a>
</div></header>

<div class="cats"><div class="wrap cb" id="cats"></div></div>

<section class="hero">
  <h1>Cool games</h1>
  <p id="heroSub"></p>
  <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" type="search" placeholder="Поиск: тема, уровень, грамматика, учебник…" aria-label="Поиск" autocomplete="off"></div>
</section>

<main class="wrap">
  <div class="filters">
    <select id="fCat" aria-label="Категория"></select>
    <select id="fLvl" aria-label="Уровень"><option value="">All Levels</option><option>A1–A2</option><option>B1</option><option>B2</option><option>C1</option></select>
    <select id="fSort" aria-label="Сортировка"><option value="new">Newest First</option><option value="old">Oldest First</option><option value="az">A–Z</option></select>
    <button class="reset" id="reset">Сбросить</button>
    <span class="show">Showing <b id="shown">0</b> activities</span>
  </div>
  <div id="view"></div>
  <p class="none" id="no">Ничего не найдено.</p>
</main>
<footer>Cool games · игры и тренажёры по английскому</footer>

<script>
/* Categories: key, label, colour token, icon path(s) */
var C=[
 ["spot","Spotlight","--spot",'<path d="M4 19V5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2zm0 0a2 2 0 0 1 2-2h12"/>'],
 ["speak","Speaking","--speak",'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12z"/>'],
 ["listen","Listening","--listen",'<path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/>'],
 ["gram","Grammar","--gram",'<path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2zM22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/>'],
 ["vocab","Vocabulary","--vocab",'<path d="M5 6V4h14v2M12 4v16M9 20h6"/>'],
 ["write","Writing","--write",'<path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4"/>'],
 ["exam","ЕГЭ","--exam",'<path d="M9 4h6v3H9zM7 5H5v16h14V5h-2"/><path d="M9 13l2 2 4-4"/>']
];
var NEWI='<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>';
var GRIDI='<path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/>';
/* Games are listed in games.json (edited from the "Управление" page). */
var G=[];
var CAT={};C.forEach(function(c){CAT[c[0]]=c});
var NEWEST="";
var $=function(id){return document.getElementById(id)};
function esc(s){return s.replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function ico(p){return '<svg viewBox="0 0 24 24">'+p+'</svg>'}
var st;
function card(g){
  return '<a class="g" href="games/'+g[2]+'.html"><div class="pic">'+(g[7]?'<img src="'+g[7]+'" alt="" loading="lazy">':'')+
   (g[5]===NEWEST?'<span class="new">NEW</span>':'')+'<span class="lvl">'+g[4]+'</span></div>'+
   '<div class="body"><div class="t">'+esc(g[0])+'</div><div class="d">'+esc(g[1])+'</div><div class="tags">'+
   g[3].filter(function(k){return CAT[k]}).map(function(k){return '<span style="--c:var('+CAT[k][2]+')">'+CAT[k][1]+'</span>'}).join("")+
   g[6].map(function(t){return '<span style="--c:var(--mute)">'+esc(t)+'</span>'}).join("")+'</div></div></a>';}
function section(icon,color,title,sub,list){
  return '<section class="sec"><div class="sh"><span class="ic" style="--c:'+color+'">'+ico(icon)+'</span><h2>'+esc(title)+'</h2><small>'+esc(sub)+'</small></div><div class="grid">'+list.map(card).join("")+'</div></section>';}
function draw(){
  $("cats").innerHTML=C.map(function(c){return '<button class="cat'+(st.cat===c[0]?' on':'')+'" style="--c:var('+c[2]+')" data-k="'+c[0]+'">'+ico(c[3])+c[1]+'</button>'}).join("");
  $("cats").querySelectorAll(".cat").forEach(function(b){b.onclick=function(){st.cat=st.cat===b.dataset.k?"":b.dataset.k;st.all=true;draw()}});
  $("navHome").classList.toggle("on",!st.all);$("navAll").classList.toggle("on",st.all);
  $("fCat").value=st.cat;$("fLvl").value=st.lvl;$("fSort").value=st.sort;
  var list=G.filter(function(g){
    return (!st.cat||g[3].indexOf(st.cat)>-1)&&(!st.lvl||g[4]===st.lvl)&&
      (!st.q||(g[0]+" "+g[1]+" "+g[4]+" "+g[6].join(" ")+" "+g[3].map(function(k){return CAT[k]?CAT[k][1]:""}).join(" ")).toLowerCase().indexOf(st.q)>-1)});
  list.sort(st.sort==="az"?function(a,b){return a[0].localeCompare(b[0])}:st.sort==="old"?function(a,b){return a[5]<b[5]?-1:a[5]>b[5]?1:0}:function(a,b){return a[5]<b[5]?1:a[5]>b[5]?-1:0});
  $("shown").textContent=list.length;
  var h="";
  if(!st.all&&!st.cat&&!st.lvl&&!st.q){
    h+=section(NEWI,"#f2a20c","What's New","последние добавленные",list.slice(0,5));
    h+=section(GRIDI,"var(--teal)","All Activities","остальные игры и тренажёры",list.slice(5));
  }else if(list.length){
    var c=st.cat?CAT[st.cat]:null;
    h+=section(c?c[3]:GRIDI,c?"var("+c[2]+")":"var(--teal)",c?c[1]:"Activities",st.lvl?"уровень "+st.lvl:"все уровни",list);
  }
  $("view").innerHTML=h;$("no").style.display=list.length?"none":"block";
}
$("fCat").innerHTML='<option value="">All Categories</option>'+C.map(function(c){return '<option value="'+c[0]+'">'+c[1]+'</option>'}).join("");
function counts(){
  $("countTop").textContent=G.length+" activities";
  $("heroSub").textContent=G.length+" интерактивных игр и тренажёров по английскому";}
$("fCat").onchange=function(){st.cat=this.value;st.all=true;draw()};
$("fLvl").onchange=function(){st.lvl=this.value;st.all=true;draw()};
$("fSort").onchange=function(){st.sort=this.value;st.all=true;draw()};
$("q").oninput=function(){st.q=this.value.trim().toLowerCase();draw()};
$("navAll").onclick=function(){st.all=true;draw()};
$("navHome").onclick=$("logo").onclick=$("reset").onclick=fresh;
/* Always open at the very top with nothing selected. */
if("scrollRestoration" in history)history.scrollRestoration="manual";
function fresh(){st={cat:"",lvl:"",sort:"new",q:"",all:false};$("q").value="";draw();window.scrollTo(0,0)}
window.addEventListener("pageshow",function(){if(st)fresh()});
fetch("games.json?v="+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).then(function(list){
  G=list.map(function(g){return [g.title||"",g.desc||"",g.file,g.cats||[],g.level||"",g.date||"",g.tags||[],g.thumb||""]});
  NEWEST=G.map(function(g){return g[5]}).sort().slice(-1)[0]||"";
  counts();fresh();
}).catch(function(){counts();fresh();$("no").textContent="Не удалось загрузить список игр. Обновите страницу.";$("no").style.display="block"});
</script>
</body>
</html>
