<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cool games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=PT+Sans:wght@400;700&display=swap">
<style>
:root{
  --bg:#f6f3ec;--card:#fffdf8;--ink:#1f2433;--mute:#5d6377;--line:#e3ddcf;
  --speak:#0e8f8a;--vocab:#2f9a4a;--gram:#e0701a;--write:#2f62d6;--exam:#b8327e;
  --serif:"PT Serif",Georgia,"Times New Roman",serif;--sans:"PT Sans","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1d27;--card:#242836;--ink:#eef0f6;--mute:#a8aec2;--line:#363b4d}}
:root[data-theme="dark"]{--bg:#1a1d27;--card:#242836;--ink:#eef0f6;--mute:#a8aec2;--line:#363b4d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 var(--sans)}
main{max-width:1240px;margin:0 auto;padding:10px 16px 24px}

/* compact top bar */
.top{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:9px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px}
h1{margin:0;font:700 26px/1 var(--serif);white-space:nowrap}
h1 span{color:var(--gram)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.tab{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:6px 13px;font:700 14px var(--sans);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tab i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--ink))}
.tab em{font-style:normal;opacity:.65;font-weight:400}
.tab[aria-pressed="true"]{background:var(--c,var(--ink));border-color:var(--c,var(--ink));color:#fff}
.tab[aria-pressed="true"] i{background:#fff}
input{width:200px;max-width:100%;padding:8px 14px;border:1.5px solid var(--line);border-radius:99px;background:var(--bg);color:var(--ink);font:15px var(--sans)}

/* game cards with picture */
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
a.g{display:flex;flex-direction:column;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-bottom:5px solid var(--c);border-radius:14px;overflow:hidden;transition:transform .14s,box-shadow .14s}
a.g:hover,a.g:focus-visible{transform:translateY(-4px);box-shadow:0 10px 24px color-mix(in srgb,var(--c) 30%,transparent);outline:none}
.pic{position:relative;aspect-ratio:16/10;background:color-mix(in srgb,var(--c) 15%,var(--card));border-bottom:1px solid var(--line)}
.pic img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.chip{position:absolute;left:8px;top:8px;background:var(--c);color:#fff;font:700 12px var(--sans);letter-spacing:.3px;border-radius:99px;padding:2px 10px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.body{padding:9px 11px 11px;display:flex;flex-direction:column;gap:4px;flex:1}
.t{font:700 16px/1.22 var(--serif)}
.d{color:var(--mute);font-size:13.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto;padding-top:3px}
.tags span{font-size:11.5px;font-weight:700;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:99px;padding:0 7px}
.none{display:none;color:var(--mute);text-align:center;padding:30px}
@media (max-width:1100px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:860px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.top{padding:10px}h1{font-size:22px}input{width:100%}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
@media (max-width:400px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<div class="top">
  <h1>Cool <span>games</span></h1>
  <div class="tabs" id="tabs"></div>
  <input id="q" type="search" placeholder="Поиск игры" aria-label="Поиск" autocomplete="off">
</div>
<div class="grid" id="grid"></div>
<p class="none" id="no">Ничего не найдено.</p>
</main>
<script>
/* Activities in display order; each game: [title, description, file name in games/, tags] */
var A=[
{n:"Speaking",c:"--speak",i:[
 ["Ten Faces, Ten Questions","10 человек задают вопросы вслух: 5 тем и ревижн Unit 1, Redo, лист для печати","ten-faces",["интервью","на слух"]],
 ["Spotlight 11 · Module 1: Speed Game","Relationships: 20 sec finish, guess the ending, missing word, 60 sec rush","spotlight11-speed-game",["Spotlight 11","таймер"]]]},
{n:"Vocabulary",c:"--vocab",i:[
 ["Word Walls","Стены со словами: собери стену, потом тест","word-walls",["стена слов"]],
 ["Spotlight 10 · Module 1: Word Walls","Teen life, Character, Appearance: собери стену, потом тест","word-walls-spotlight10",["Spotlight 10"]],
 ["Word Formation: Team Challenge","Словообразование: 4 уровня A2–C1, 100 заданий, командами с таймером","word-formation",["A2–C1","jeopardy"]]]},
{n:"Grammar",c:"--gram",i:[
 ["Funny Travel Stories: Past Simple","8 историй путешественников с аудио, карточки, бонус-раунд","funny-travel-stories",["Past Simple","аудио"]],
 ["60 Common Verbs: Sentence Builder","60 глаголов с фото: форма + время, Mixed Review, лист для печати","sixty-verbs",["фото","времена"]],
 ["Rewrite: Present Simple vs Continuous","Перепишите предложения","rewrite-tenses",["Present tenses"]]]},
{n:"Writing",c:"--write",i:[
 ["Chat Reply: Across Generations","10 чатов, карточки с озвучкой, игра «Who is replying?»","chat-reply",["чаты","стиль"]]]},
{n:"ЕГЭ",c:"--exam",i:[
 ["Тренажёр «Travelling»","Задания в формате ФИПИ","ege-travelling",["ФИПИ"]]]}
];
var cur="all",q="";
function esc(s){return s.replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function tabs(){
  var total=A.reduce(function(s,a){return s+a.i.length},0);
  var h='<button class="tab" data-n="all" aria-pressed="'+(cur==="all")+'">Все <em>'+total+'</em></button>';
  A.forEach(function(a){h+='<button class="tab" style="--c:var('+a.c+')" data-n="'+esc(a.n)+'" aria-pressed="'+(cur===a.n)+'"><i></i>'+esc(a.n)+' <em>'+a.i.length+'</em></button>'});
  var t=document.getElementById("tabs");t.innerHTML=h;
  t.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){cur=b.dataset.n;tabs();draw()}});
}
function draw(){
  var h="",n=0;
  A.forEach(function(a){
    if(cur!=="all"&&cur!==a.n)return;
    a.i.forEach(function(x){
      if((x[0]+" "+x[1]+" "+x[3].join(" ")).toLowerCase().indexOf(q)<0)return;n++;
      h+='<a class="g" style="--c:var('+a.c+')" href="games/'+x[2]+'.html">'+
        '<div class="pic"><img src="games/thumbs/'+x[2]+'.jpg" alt="" loading="lazy"><span class="chip">'+esc(a.n)+'</span></div>'+
        '<div class="body"><div class="t">'+esc(x[0])+'</div><div class="d">'+esc(x[1])+'</div>'+
        '<div class="tags">'+x[3].map(function(t){return '<span>'+esc(t)+'</span>'}).join("")+'</div></div></a>';
    });
  });
  document.getElementById("grid").innerHTML=h;
  document.getElementById("no").style.display=n?"none":"block";
}
document.getElementById("q").oninput=function(){q=this.value.trim().toLowerCase();draw()};
/* Always open at the very top of the page, with all games and an empty search. */
if("scrollRestoration" in history)history.scrollRestoration="manual";
function fresh(){cur="all";q="";document.getElementById("q").value="";tabs();draw();window.scrollTo(0,0)}
window.addEventListener("pageshow",fresh);
fresh();
</script>
</body>
</html>
