const WORDS=[['go shopping','ходить за покупками'],['try on','примерять'],['fit','подходить по размеру'],['too small','слишком маленький'],['too long','слишком длинный'],['match','сочетаться'],['on sale','на распродаже'],['size','размер'],['shop assistant','продавец-консультант'],['receipt','чек'],['at the till','на кассе'],['second-hand shop','магазин подержанных вещей']];
const main=document.getElementById('main'),board=document.getElementById('board'),footer=document.getElementById('footerStatus'),headerStage=document.getElementById('headerStage');
const state={view:'home',index:0,q:0,review:0,seconds:25,duration:25,timer:null,answers:STORIES.map(s=>Array(s.questions.length).fill(null)),checked:STORIES.map(()=>false)};
function escapeHtml(v){return String(v).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));}
function btn(title,action,kind='btn',extra=''){return `<button type="button" class="${kind}" data-action="${action}" ${extra}>${title}</button>`;}
function clearTimer(){if(state.timer!==null){clearInterval(state.timer);state.timer=null;}}
function answered(i){return state.answers[i].filter(v=>Number.isInteger(v)).length;}
function points(i){return STORIES[i].questions.reduce((n,q,j)=>n+(state.answers[i][j]===q[2]?1:0),0);}
function total(){return STORIES.reduce((n,c,i)=>n+(state.checked[i]?points(i):0),0);}
function doneCount(){return state.checked.filter(Boolean).length;}
function setView(view){state.view=view;render();}
function setFooter(message){footer.textContent=message;headerStage.textContent=`${Math.min(state.index+1,4)} / 4 STORIES`;}
function home(){headerStage.textContent=`${doneCount()} / 4 COMPLETED`;footer.textContent='4 STORIES · 32 QUESTIONS · OFFLINE';return `<div class="screen"><div class="eyebrow">A1 · Shopping & Clothes · Memory Challenge</div><h1 class="hero-title">Shopping Secrets</h1><p class="lead">Four little shopping stories, four unexpected surprises. <strong>Read, remember and solve the mystery.</strong> Then answer the questions without looking at the story.</p><div class="case-grid">${STORIES.map((s,i)=>`<button class="case-card" type="button" data-action="openCase" data-case="${i}" aria-label="Open ${escapeHtml(s.name)}"><div class="case-art art${i+1}"><span class="art-number">0${i+1}</span></div><div class="card-body"><span class="card-kicker">${escapeHtml(s.type.toUpperCase())}</span><strong class="card-title">${escapeHtml(s.name)}</strong><span class="card-desc">${escapeHtml(s.short)}</span><span class="card-go">${state.checked[i]?`Completed · ${points(i)}/8`:'Open story →'}</span></div></button>`).join('')}</div><div class="button-row">${btn('Start story 1 →','startFirst')}${btn('Shopping words','words','btn soft')}</div><div class="selector-row"><label for="timeSelect">Reading time</label><select id="timeSelect" aria-label="Reading time"><option value="25" ${state.duration===25?'selected':''}>25 seconds</option><option value="35" ${state.duration===35?'selected':''}>35 seconds</option><option value="45" ${state.duration===45?'selected':''}>45 seconds</option></select><span>· ${doneCount()}/4 stories completed</span></div></div>`;}
function intro(){const s=STORIES[state.index];setFooter(`STORY ${state.index+1}/4 · READY`);return `<div class="screen"><div class="eyebrow">Story ${state.index+1} of 4 · ${escapeHtml(s.type)}</div><h2 class="section-title">${escapeHtml(s.name)}</h2><p class="lead">${escapeHtml(s.short)}</p><div class="info-box">Read the story for <b>${state.duration} seconds</b>. Remember the people, colours, prices and small details. The story will disappear automatically.</div><div class="button-row">${btn(`Show the story · ${state.duration} sec →`,'observe')}${btn('All stories','home','btn soft')}</div><p class="small-hint">Next: 8 memory questions. You can skip a question and answer it later.</p></div>`;}
function observe(){const s=STORIES[state.index];return `<div class="read-screen"><article class="reading-paper"><div class="reading-header"><div class="reading-title">STORY 0${state.index+1} · ${escapeHtml(s.name)}</div><div class="clock ${state.seconds<=7?'low':''}"><b id="countSeconds">${state.seconds}</b><span>SECONDS</span></div></div><p class="reading-text">${escapeHtml(s.story)}</p></article><div class="reading-tools"><span>Look carefully. The story will disappear automatically.</span>${btn('Hide story now →','toQuestions','btn soft sm')}</div></div>`;}
function question(){const s=STORIES[state.index],q=s.questions[state.q],chosen=state.answers[state.index][state.q],n=s.questions.length;setFooter(`STORY ${state.index+1}/4 · QUESTION ${state.q+1}/${n} · ANSWERED ${answered(state.index)}/${n}`);return `<div class="screen"><div class="eyebrow">Story 0${state.index+1} · Memory Check · ${answered(state.index)}/${n} answered</div><div class="progress-dots">${s.questions.map((_,i)=>`<button type="button" class="dot-btn ${i===state.q?'current':''} ${Number.isInteger(state.answers[state.index][i])?'answered':''}" data-action="jumpQuestion" data-q="${i}" aria-label="Question ${i+1}">${i+1}</button>`).join('')}</div><h2 class="question">${escapeHtml(q[0])}</h2><div class="choices">${q[1].map((a,i)=>`<button class="choice ${chosen===i?'chosen':''}" type="button" data-answer="${i}" aria-pressed="${chosen===i}"><span class="letter">${'ABCD'[i]}</span><span>${escapeHtml(a)}</span></button>`).join('')}</div><div class="question-nav">${btn('← Previous','backQuestion','btn soft')}${btn(state.q===n-1?'Check answers →':'Next →','nextQuestion')}${btn('Check this story','submit','btn mint')}</div><p class="numstatus">You may leave answers blank, move back and change your choices before checking.</p></div>`;}
function score(){const s=STORIES[state.index],p=points(state.index);setFooter(`STORY ${state.index+1}/4 · COMPLETED · ${p}/8`);return `<div class="screen"><div class="eyebrow">Story ${state.index+1} · Results</div><h2 class="section-title">${escapeHtml(s.name)}</h2><div class="result-box"><div class="score">${p}<span> / 8</span></div><p class="scoretext">${p===8?'Perfect memory! You noticed every clue.':p>=6?'Excellent! You remembered most of the details.':p>=4?'Good effort. Let’s look more carefully at the clues.':'The little details were tricky. Review the story and try again.'}</p></div><div class="button-row">${btn('Check every answer','startReview')}${state.index<3?btn('Next story →','nextCase','btn dark'):btn('Final results →','final','btn dark')}${btn('Try this story again','replay','btn soft')}</div><p class="small-hint">Your answers are saved until you restart the challenge.</p></div>`;}
function review(){const s=STORIES[state.index],q=s.questions[state.review],answer=state.answers[state.index][state.review],correct=answer===q[2];setFooter(`STORY ${state.index+1}/4 · ANSWER REVIEW ${state.review+1}/8`);return `<div class="screen"><div class="eyebrow">Answer review · ${state.review+1}/8</div><div class="review-card"><div class="review-mark ${correct?'':'bad'}">${correct?'CORRECT':answer===null?'NOT ANSWERED':'NOT QUITE'}</div><h2 class="review-question">${escapeHtml(q[0])}</h2><p class="answer-line">Your answer: <b class="${correct?'':'incorrect'}">${answer===null?'—':escapeHtml(q[1][answer])}</b></p><p class="answer-line">Correct answer: <b>${escapeHtml(q[1][q[2]])}</b></p><p class="explanation">${escapeHtml(q[3])}</p></div><div class="button-row">${btn('← Previous','reviewBack','btn soft')}${btn(state.review===s.questions.length-1?'Back to score →':'Next answer →','reviewNext')}</div></div>`;}
function finale(){headerStage.textContent=`${doneCount()} / 4 COMPLETED`;footer.textContent='SHOPPING SECRETS · FINAL RESULTS';return `<div class="screen"><div class="eyebrow">Shopping Secrets · Memory Challenge</div><h2 class="section-title">Your Shopping Detective Score</h2><div class="score">${total()}<span> / 32</span></div><div class="summary-grid">${STORIES.map((s,i)=>`<div class="summary-item"><strong>${state.checked[i]?points(i):'—'}<span> / 8</span></strong><span>0${i+1} · ${escapeHtml(s.name)}</span></div>`).join('')}</div><p class="scoretext">${doneCount()===4?'Four stories completed. Great work!':'You can still finish the other stories.'}</p><div class="final-menu">${btn('Choose a story','home')}${btn('Shopping words','words','btn soft')}${btn('Start all over','reset','btn dark')}</div></div>`;}
function words(){footer.textContent='SHOPPING WORDS · A1';headerStage.textContent='WORD BANK';return `<div class="screen"><div class="eyebrow">Helpful Language · A1</div><h2 class="section-title">Shopping Words</h2><div class="words-grid">${WORDS.map(w=>`<div class="word"><b>${escapeHtml(w[0])}</b><span>${escapeHtml(w[1])}</span></div>`).join('')}</div><div class="button-row">${btn('Back to stories','home')}${btn('Start the challenge →','startFirst','btn soft')}</div></div>`;}
function render(){board.classList.toggle('observe',state.view==='observe');main.innerHTML=({home,intro,observe,questions:question,score,review,final:finale,words}[state.view]||home)();}
function beginCase(i){clearTimer();state.index=i;state.q=0;state.review=0;state.answers[i]=Array(STORIES[i].questions.length).fill(null);state.checked[i]=false;setView('intro');}
function startReading(){clearTimer();state.seconds=state.duration;setView('observe');state.timer=window.setInterval(()=>{if(state.view!=='observe'){clearTimer();return;}state.seconds=Math.max(0,state.seconds-1);const el=document.getElementById('countSeconds');if(el)el.textContent=String(state.seconds);const chip=document.querySelector('.clock');if(chip)chip.classList.toggle('low',state.seconds<=7);if(state.seconds===0)showQuestions();},1000);}
function showQuestions(){clearTimer();state.q=0;setView('questions');}
function submitCase(){const blanks=STORIES[state.index].questions.length-answered(state.index);if(blanks && !window.confirm(`${blanks} question${blanks===1?' is':'s are'} unanswered. Check your answers now?`))return;state.checked[state.index]=true;setView('score');}
function resetAll(){clearTimer();state.index=0;state.q=0;state.review=0;state.answers=STORIES.map(s=>Array(s.questions.length).fill(null));state.checked=STORIES.map(()=>false);setView('home');}
function action(type,element){switch(type){case 'home':clearTimer();setView('home');break;case 'words':clearTimer();setView('words');break;case 'startFirst':beginCase(0);break;case 'openCase':beginCase(Number(element.dataset.case));break;case 'observe':startReading();break;case 'toQuestions':showQuestions();break;case 'jumpQuestion':state.q=Number(element.dataset.q);setView('questions');break;case 'backQuestion':if(state.q>0){state.q--;setView('questions');}break;case 'nextQuestion':if(state.q<STORIES[state.index].questions.length-1){state.q++;setView('questions');}else submitCase();break;case 'submit':submitCase();break;case 'startReview':state.review=0;setView('review');break;case 'reviewBack':if(state.review>0){state.review--;setView('review');}break;case 'reviewNext':if(state.review<STORIES[state.index].questions.length-1){state.review++;setView('review');}else setView('score');break;case 'nextCase':if(state.index<STORIES.length-1)beginCase(state.index+1);else setView('final');break;case 'replay':beginCase(state.index);break;case 'final':setView('final');break;case 'reset':if(window.confirm('Restart all four stories?'))resetAll();break;}}
main.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.hasAttribute('data-answer')&&state.view==='questions'){state.answers[state.index][state.q]=Number(b.dataset.answer);setView('questions');return;}if(b.dataset.action)action(b.dataset.action,b);});
main.addEventListener('change',event=>{if(event.target.id==='timeSelect'){const seconds=Number(event.target.value);if([25,35,45].includes(seconds))state.duration=seconds;}});
document.getElementById('homeBtn').addEventListener('click',()=>{if(state.view==='observe'&&!window.confirm('Hide this story and return home?'))return;clearTimer();setView('home');});
document.getElementById('fullscreenBtn').addEventListener('click',()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>{});}else{document.exitFullscreen?.().catch(()=>{});}});
document.addEventListener('keydown',event=>{if(event.altKey||event.ctrlKey||event.metaKey||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if(state.view==='questions'){if(['1','2','3','4'].includes(event.key)){state.answers[state.index][state.q]=Number(event.key)-1;setView('questions');}else if(event.key==='ArrowRight'){event.preventDefault();if(state.q<7){state.q++;setView('questions');}}else if(event.key==='ArrowLeft'){event.preventDefault();if(state.q>0){state.q--;setView('questions');}}else if(event.key==='Enter'){event.preventDefault();action('nextQuestion',null);}}else if(event.key==='Enter'&&state.view==='intro'){startReading();}if(event.key.toLowerCase()==='f'){event.preventDefault();document.getElementById('fullscreenBtn').click();}});
window.addEventListener('pagehide',clearTimer);
render();
</script>
</body>
</html>
