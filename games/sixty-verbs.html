<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>60 Common Verbs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0d1b3d; --navy2:#16295a; --cream:#f4efe4; --card:#fffdf8; --line:#ddd3c0;
  --ink:#0d1b3d; --muted:#5d6477; --green:#12a45c; --red:#d8433a; --blue:#2f72d6;
  --orange:#f07a1c; --amber:#c98a16;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;background:var(--cream);color:var(--ink);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:8px;gap:8px}
.hide{display:none!important}

/* top bar */
.top{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 8px 6px 14px;flex:none}
.top h1{font-size:20px;font-weight:900;margin:0;letter-spacing:-.3px;white-space:nowrap}
.top h1 span{color:var(--green)}
.tag{font-size:12px;font-weight:800;letter-spacing:1px;color:var(--green);background:#e2f5ea;border:1px solid #b9e3c9;border-radius:99px;padding:3px 9px;white-space:nowrap}
.sub{font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.round{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--cream);font-weight:800;font-size:16px;flex:none}
.tabs{display:flex;background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:3px;flex:none}
.tabs button{padding:8px 16px;border-radius:9px;font-weight:800;font-size:14px;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--navy);color:#fff}
.act{padding:10px 16px;border-radius:11px;font-weight:800;font-size:14px;color:#fff;white-space:nowrap;flex:none}
.act.g{background:var(--green)} .act.o{background:var(--orange)}

/* grid */
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(4,1fr);gap:8px}
.tile{position:relative;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,var(--navy2),#31508f);padding:0;min-height:0}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .25s}
.tile:after{content:"";position:absolute;inset:0;background:rgba(8,16,40,.36);transition:background .2s}
.tile:hover img{transform:scale(1.05)} .tile:hover:after{background:rgba(8,16,40,.18)}
.tile b{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:900;letter-spacing:.5px;text-transform:uppercase;text-shadow:0 2px 8px rgba(0,0,0,.6)}

/* card */
.cardv{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 262px;gap:8px}
.left{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
.photo{position:relative;flex:1;min-height:0;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,var(--navy2),#31508f);border:1px solid var(--line)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:64px;font-weight:900;text-transform:uppercase;opacity:.9}
.pbtn{position:absolute;z-index:2;background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.25);font-weight:800;font-size:13px;padding:8px 12px}
.home{top:10px;left:10px;display:flex;align-items:center;gap:6px}
.badge{top:10px;right:10px;border-radius:99px;cursor:default}
.swap{bottom:10px;right:10px}
.bar{flex:none;background:radial-gradient(circle at 20% 0,#22397a,var(--navy) 60%);color:#fff;border-radius:16px;min-height:104px;padding:10px 16px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.verbrow{display:flex;align-items:center;justify-content:center;gap:14px}
.verb{font-size:42px;font-weight:900;letter-spacing:-.5px;line-height:1}
.spk{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);display:inline-flex;align-items:center;justify-content:center;flex:none}
.spk svg{width:18px;height:18px;fill:#fff}
.ghost{border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700;color:#fff}
.forms{font-size:20px;font-weight:700;color:#cfe0ff}
.taskrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{background:#fff;color:var(--ink);border-radius:9px;padding:5px 10px;font-size:18px;font-weight:800;display:inline-flex;align-items:baseline;gap:7px}
.chip i{font-style:normal;font-size:12px;letter-spacing:1px;font-weight:800;text-transform:uppercase}
.chip.s i{color:var(--blue)} .chip.v i{color:var(--green)} .chip.o i{color:#7a4cc2} .chip.t i{color:var(--amber)}
.make{margin-left:auto;font-size:14px;font-weight:800;border-radius:99px;padding:6px 12px;color:#fff;white-space:nowrap}
.ansrow{display:flex;align-items:center;gap:12px;min-height:40px}
.show{background:var(--orange);color:#fff;font-weight:800;font-size:16px;border-radius:10px;padding:9px 18px}
.ans{font-size:25px;font-weight:700;line-height:1.15}
.ans b{color:#ffd166;font-weight:900}

/* side panel */
.side{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:0}
.lvl{display:flex;background:var(--cream);border:1px solid var(--line);border-radius:99px;padding:3px;flex:none}
.lvl button{flex:1;padding:7px;border-radius:99px;font-weight:800;font-size:14px;color:var(--muted)}
.lvl button.on.b{background:var(--green);color:#fff} .lvl button.on.a{background:var(--navy);color:#fff}
.lab{font-size:12px;font-weight:800;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase;flex:none}
.formsel{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;flex:none}
.formsel button{border:2px solid var(--line);border-radius:12px;background:var(--cream);padding:6px 2px;font-weight:800;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:3px}
.formsel .dot{width:22px;height:22px;border-radius:50%;color:#fff;font-size:13px;line-height:22px;font-weight:900}
.formsel button.on{background:#fff;box-shadow:0 0 0 3px rgba(18,164,92,.18)}
.tenses{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.tenses button{flex:1;min-height:38px;text-align:left;border:1px solid var(--line);border-radius:12px;background:linear-gradient(#fffdf8,#f3ebdc);padding:2px 10px 2px 16px;position:relative;display:flex;flex-direction:column;justify-content:center}
.tenses button:before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:4px;border-radius:4px;background:var(--c)}
.tenses button strong{font-size:19px;font-weight:900;letter-spacing:-.3px;line-height:1.1}
.tenses button small{font-size:12px;font-weight:700;color:var(--muted)}
.tenses button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tenses button.on small{color:#c9d6f5}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:none}
.nav button{height:42px;border-radius:12px;background:var(--navy);color:#fff;font-size:22px;font-weight:900}
.nav button.sec{background:#a9a59b}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(8,16,40,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal{background:var(--card);border-radius:18px;padding:22px 26px;max-width:620px;width:100%;max-height:100%;overflow:auto}
.modal h2{margin:0 0 10px;font-size:24px;font-weight:900}
.modal p,.modal li{font-size:17px;line-height:1.4;margin:0 0 8px}
.modal ol{padding-left:22px;margin:0 0 10px}
.mrow{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.mrow button{padding:11px 20px;border-radius:11px;font-weight:800;font-size:16px;color:#fff;background:var(--navy)}
.mrow button.o{background:var(--orange)} .mrow button.l{background:var(--cream);color:var(--ink);border:1px solid var(--line)}
.small{font-size:13px!important;color:var(--muted)}

/* worksheet */
.wsv{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.wstools{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 8px;flex:none;flex-wrap:wrap}
.wstools b{font-size:18px;font-weight:900;margin:0 8px 0 6px}
.wstools button{padding:9px 14px;border-radius:10px;font-weight:800;font-size:14px;background:var(--cream);border:1px solid var(--line)}
.wstools button.p{background:var(--green);color:#fff;border-color:var(--green)}
.wstools button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.wsscroll{flex:1;min-height:0;overflow:auto;border-radius:14px}
.sheet{background:#fff;max-width:860px;margin:0 auto 10px;padding:22px 28px;border:1px solid var(--line);border-radius:6px}
.shead{background:linear-gradient(90deg,#0f8f52,#12a45c);color:#fff;border-radius:6px;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.shead h3{margin:0;font-size:20px;font-weight:900} .shead span{font-size:13px;font-weight:700}
.nline{display:flex;gap:30px;padding:12px 0;border-bottom:1px solid #e6e0d2;font-size:14px;font-weight:700}
.nline span{flex:1;border-bottom:1px solid #999;margin-left:6px}
.nline div{display:flex;flex:1}
.instr{font-size:14px;font-weight:600;margin:10px 0 4px}
.item{display:flex;gap:16px;padding:12px 0;border-bottom:1px solid #e6e0d2;break-inside:avoid}
.item .pic{width:120px;height:86px;border-radius:8px;overflow:hidden;position:relative;background:var(--navy2);flex:none}
.item .pic img{width:100%;height:100%;object-fit:cover}
.item .pic em{position:absolute;top:5px;left:5px;background:var(--green);color:#fff;font-style:normal;font-weight:900;font-size:13px;border-radius:6px;padding:1px 7px}
.item .body{flex:1;min-width:0}
.item .chips{display:flex;flex-wrap:wrap;gap:6px}
.item .chip{border:1px solid #d9d2c2;font-size:14px;padding:3px 8px;background:#faf7f0}
.item .chip i{font-size:10px}
.item .mk{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:13px;font-weight:800}
.item .mk .make{margin:0;font-size:12px;padding:4px 10px}
.wline{border-bottom:1px solid #b9ae95;height:30px}
.key{font-size:15px;font-weight:700;color:#0f8f52;padding-top:8px}
.sfoot{font-size:12px;color:var(--muted);padding-top:10px;font-weight:600}

@media (max-width:1000px){.sub{display:none}}
@media (max-width:860px){
  body{overflow:auto}.app{height:auto;min-height:100vh}
  .top{flex-wrap:wrap}.grid{grid-template-columns:repeat(2,1fr);grid-template-rows:none;grid-auto-rows:110px}
  .cardv{grid-template-columns:1fr}.photo{min-height:240px;flex:none}
}
@media print{
  @page{margin:10mm}
  body{overflow:visible;background:#fff}
  .app{height:auto;padding:0;display:block}
  .top,.wstools,.ov{display:none!important}
  .wsv,.wsscroll{display:block;overflow:visible}
  .sheet{border:0;margin:0;padding:0;max-width:none;break-after:page}
  .sheet:last-child{break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

const TABS=[["Verbs A–F",0,20],["Verbs F–R",20,40],["Verbs R–W",40,60]];
const TENSES=[
 {id:"ps",  label:"Every day",      name:"Present Simple",     time:"every day", c:"#12a45c"},
 {id:"pc",  label:"Right now",      name:"Present Continuous", time:"right now", c:"#d8433a"},
 {id:"past",label:"Yesterday",      name:"Past Simple",        time:"yesterday", c:"#c98a16"},
 {id:"fut", label:"Tomorrow",       name:"Future Simple",      time:"tomorrow",  c:"#2f72d6"},
 {id:"pp",  label:"Already / yet",  name:"Present Perfect",    time:"already / yet", c:"#12a45c", adv:1},
 {id:"pastc",label:"Yesterday at 8",name:"Past Continuous",    time:"at 8 o'clock yesterday", c:"#d8433a", adv:1}
];
const FORMS=[{id:"pos",label:"Positive",mark:"✓",c:"#12a45c"},{id:"neg",label:"Negative",mark:"✕",c:"#d8433a"},{id:"q",label:"Question",mark:"?",c:"#2f72d6"}];
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const lower=s=>s.charAt(0).toLowerCase()+s.slice(1);

/* ---------- sentence engine ---------- */
function sentence(v,tense,form){
  const be=v.pl?"are":"is", was=v.pl?"were":"was", have=v.pl?"have":"has", does=v.pl?"do":"does";
  const S=v.subj, s=lower(v.subj), R=v.rest;
  let p=[]; // [text, highlighted]
  const H=t=>[t,1], N=t=>[t,0];
  const tail=(time)=>[R&&N(R),time&&N(time)].filter(Boolean);
  const mk=(aux,negAux,verb,time,extra)=>{
    if(form==="pos") return [N(S), aux&&H(aux), extra&&N(extra), H(verb), ...tail(time)].filter(Boolean);
    if(form==="neg") return [N(S), H(negAux), H(verb), ...tail(time)];
    return [H(aux.charAt(0).toUpperCase()+aux.slice(1)), N(s), H(verb), ...tail(time)];
  };
  switch(tense){
    case "ps":
      if(form==="pos") p=[N(S),H(v.pl?v.base:v.s3),...tail("every day")];
      else if(form==="neg") p=[N(S),H(does+"n't"),H(v.base),...tail("every day")];
      else p=[H(does.charAt(0).toUpperCase()+does.slice(1)),N(s),H(v.base),...tail("every day")];
      break;
    case "pc": p=mk(be,be+"n't",v.ing,"right now"); break;
    case "past":
      if(form==="pos") p=[N(S),H(v.past),...tail("yesterday")];
      else if(form==="neg") p=[N(S),H("didn't"),H(v.base),...tail("yesterday")];
      else p=[H("Did"),N(s),H(v.base),...tail("yesterday")];
      break;
    case "fut": p=mk("will","won't",v.base,"tomorrow"); break;
    case "pp":
      if(form==="pos") p=[N(S),H(have),N("already"),H(v.pp),...tail("")];
      else p=mk(have,have+"n't",v.pp,"yet");
      break;
    case "pastc": p=mk(was,was+"n't",v.ing,"at 8 o'clock yesterday"); break;
  }
  const end=form==="q"?"?":".";
  return {html:p.map(x=>x[1]?"<b>"+esc(x[0])+"</b>":esc(x[0])).join(" ")+end, text:p.map(x=>x[0]).join(" ")+end};
}

/* ---------- photos ---------- */
const picks={};
try{Object.assign(picks,JSON.parse(localStorage.getItem("v60photos")||"{}"))}catch(e){}
const url=(id,w)=>"https://images.unsplash.com/photo-"+id+"?auto=format&fit=crop&w="+w+"&q=70";
function setImg(img,v,w){
  let i=(picks[v.base]||0)%v.imgs.length, tried=0;
  img.classList.remove("hide");
  img.onerror=()=>{tried++; if(tried>=v.imgs.length){img.classList.add("hide");return;} i=(i+1)%v.imgs.length; img.src=url(v.imgs[i],w);};
  img.alt=v.subj+" – "+v.base;
  img.src=url(v.imgs[i],w);
}

/* ---------- speech ---------- */
function speak(t){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t.replace(/n't/g,"n’t"));
  const vs=speechSynthesis.getVoices();
  const vv=vs.find(x=>/en-GB/i.test(x.lang)&&/Google|Natural|Sonia|Libby/i.test(x.name))||vs.find(x=>/^en-(GB|US)/i.test(x.lang))||vs.find(x=>/^en/i.test(x.lang));
  if(vv)u.voice=vv; u.lang=vv?vv.lang:"en-GB"; u.rate=.92;
  speechSynthesis.speak(u);
}
if("speechSynthesis" in window) speechSynthesis.getVoices();
const SPK='<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';

/* ---------- state ---------- */
const st={tab:0,level:"basic",form:"pos",tense:null,shown:false,forms3:false,list:[],pos:0,mix:null};
const tensesFor=l=>TENSES.filter(t=>l==="adv"||!t.adv);

/* ---------- grid ---------- */
function renderTabs(){
  $("tabs").innerHTML=TABS.map((t,i)=>`<button class="${i===st.tab?"on":""}" data-i="${i}">${t[0]}</button>`).join("");
}
function renderGrid(){
  const [,a,b]=TABS[st.tab]; const g=$("grid"); g.innerHTML="";
  V.slice(a,b).forEach((v,k)=>{
    const t=document.createElement("button"); t.className="tile";
    const img=document.createElement("img"); setImg(img,v,480); t.appendChild(img);
    const n=document.createElement("b"); n.textContent=v.base; t.appendChild(n);
    t.onclick=()=>openCard(V.slice(a,b),k,null);
    g.appendChild(t);
  });
}
function view(name){
  $("top").classList.toggle("hide",name!=="grid");
  $("grid").classList.toggle("hide",name!=="grid");
  $("cardv").classList.toggle("hide",name!=="card");
  $("wsv").classList.toggle("hide",name!=="ws");
  if("speechSynthesis" in window) speechSynthesis.cancel();
}
function goHome(){st.mix=null;view("grid");renderTabs();renderGrid();}

/* ---------- card ---------- */
function openCard(list,pos,mix){
  st.list=list; st.pos=pos; st.mix=mix; view("card"); loadVerb();
}
function loadVerb(){
  const v=st.list[st.pos];
  st.shown=false; st.forms3=false;
  if(st.mix){st.form=st.mix[st.pos].form; st.tense=st.mix[st.pos].tense;}
  else{st.tense=null; st.form="pos";}
  $("ph").textContent=v.base;
  setImg($("photo"),v,1400);
  $("swapBtn").classList.toggle("hide",v.imgs.length<2);
  $("badge").textContent=(st.mix?"Mixed Review ":"Verb ")+(st.pos+1)+" of "+st.list.length;
  renderSide(); renderBar();
}
function renderSide(){
  [...$("lvl").children].forEach(b=>b.classList.toggle("on",b.dataset.l===st.level));
  $("formsel").innerHTML=FORMS.map(f=>`<button data-f="${f.id}" class="${f.id===st.form?"on":""}" style="${f.id===st.form?"border-color:"+f.c+";color:"+f.c:""}"><span class="dot" style="background:${f.c}">${f.mark}</span>${f.label}</button>`).join("");
  $("tenses").innerHTML=tensesFor(st.level).map(t=>`<button data-t="${t.id}" class="${t.id===st.tense?"on":""}" style="--c:${t.c}"><strong>${t.label}</strong><small>${t.name}</small></button>`).join("");
}
function chips(v,t,form){
  let time=t.time;
  if(t.id==="pp") time=form==="pos"?"already":"yet";
  return `<span class="chip s"><i>Subject</i>${esc(v.subj)}</span><span class="chip v"><i>Verb</i>${v.base}</span>`+
    (v.rest?`<span class="chip o"><i>${v.kind==="p"?"More":"Object"}</i>${esc(v.rest)}</span>`:"")+
    `<span class="chip t"><i>Time</i>${time}</span>`;
}
function renderBar(){
  const v=st.list[st.pos], bar=$("bar");
  if(!st.tense){
    bar.innerHTML=`<div class="verbrow"><span class="verb">${v.base}</span><button class="spk" data-say="${v.base}" aria-label="Listen">${SPK}</button>`+
      (st.forms3?`<span class="forms">${v.base} – ${v.past} – ${v.pp}</span>`:`<button class="ghost" id="f3">3 forms</button>`)+`</div>`;
    return;
  }
  const t=TENSES.find(x=>x.id===st.tense), f=FORMS.find(x=>x.id===st.form), s=sentence(v,st.tense,st.form);
  bar.innerHTML=`<div class="taskrow">${chips(v,t,st.form)}<span class="make" style="background:${f.c}">${f.label} · ${t.name}</span></div>`+
    `<div class="ansrow">`+(st.shown
      ?`<span class="ans">${s.html}</span><button class="spk" data-say="${esc(s.text).replace(/"/g,"&quot;")}" aria-label="Listen">${SPK}</button>`
      :`<button class="show" id="showBtn">Show answer</button><span style="font-size:16px;font-weight:600;color:#c9d6f5">Say the sentence first, then check.</span>`)+`</div>`;
}
$("bar").onclick=e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.id==="f3"){st.forms3=true;renderBar();}
  else if(b.id==="showBtn"){st.shown=true;renderBar();}
  else if(b.dataset.say) speak(b.dataset.say);
};
$("lvl").onclick=e=>{const b=e.target.closest("button"); if(!b)return; st.level=b.dataset.l;
  if(st.tense && !tensesFor(st.level).some(t=>t.id===st.tense)){st.tense=null;}
  st.shown=false; renderSide(); renderBar();};
$("formsel").onclick=e=>{const b=e.target.closest("button"); if(!b)return; st.form=b.dataset.f; st.shown=false; renderSide(); renderBar();};
$("tenses").onclick=e=>{const b=e.target.closest("button"); if(!b)return; st.tense=b.dataset.t; st.shown=false; renderSide(); renderBar();};
$("homeBtn").onclick=goHome;
$("swapBtn").onclick=()=>{const v=st.list[st.pos]; picks[v.base]=((picks[v.base]||0)+1)%v.imgs.length;
  try{localStorage.setItem("v60photos",JSON.stringify(picks))}catch(e){} setImg($("photo"),v,1400);};
$("prev").onclick=()=>{st.pos=(st.pos-1+st.list.length)%st.list.length; loadVerb();};
$("next").onclick=()=>{
  if(st.mix && st.pos===st.list.length-1){
    modal(`<h2>Round finished</h2><p>You have built ${st.list.length} sentences. Start a new round with different verbs or go back to all verbs.</p>
      <div class="mrow"><button class="o" data-a="mix">New round</button><button data-a="home">All verbs</button></div>`);
    return;
  }
  st.pos=(st.pos+1)%st.list.length; loadVerb();
};

/* ---------- mixed review ---------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function tasks(n){
  const ts=tensesFor(st.level), list=shuffle(V).slice(0,n);
  const tq=shuffle(ts), fq=shuffle(FORMS);
  return {list, mix:list.map((v,i)=>({tense:tq[i%tq.length].id, form:fq[(i+Math.floor(i/fq.length))%fq.length].id}))};
}
function startMix(){const t=tasks(10); openCard(t.list,0,t.mix);}
$("mixBtn").onclick=startMix;

/* ---------- worksheet ---------- */
let ws=null, wsKey=false;
function renderWs(fresh){
  if(fresh||!ws) ws=tasks(10);
  $("wsBasic").classList.toggle("on",st.level==="basic"); $("wsAdv").classList.toggle("on",st.level==="adv"); $("wsKey").classList.toggle("on",wsKey);
  const box=$("wsscroll"); box.innerHTML="";
  for(let pg=0;pg<2;pg++){
    const sh=document.createElement("div"); sh.className="sheet";
    sh.innerHTML=`<div class="shead"><h3>60 Common Verbs</h3><span>Build Sentences in Different Tenses · Page ${pg+1} of 2</span></div>
      <div class="nline"><div>Name:<span></span></div><div>Date:<span></span></div><div>Class:<span></span></div></div>
      <p class="instr">Look at each picture and the word chips. Build the full sentence in the form shown (Positive, Negative or Question). Write your sentence on the line.</p>`;
    for(let i=pg*5;i<pg*5+5;i++){
      const v=ws.list[i], m=ws.mix[i], t=TENSES.find(x=>x.id===m.tense), f=FORMS.find(x=>x.id===m.form);
      const it=document.createElement("div"); it.className="item";
      it.innerHTML=`<div class="pic"><em>${i+1}</em></div><div class="body"><div class="chips">${chips(v,t,m.form)}</div>
        <div class="mk"><span class="make" style="background:${f.c}">Make it: ${f.label}</span>${t.name}</div>`+
        (wsKey?`<div class="key">${sentence(v,m.tense,m.form).text}</div>`:`<div class="wline"></div>`)+`</div>`;
      const img=document.createElement("img"); setImg(img,v,300); it.firstChild.prepend(img);
      sh.appendChild(it);
    }
    sh.insertAdjacentHTML("beforeend",`<div class="sfoot">60 Common Verbs · Sentence practice · ${wsKey?"Answer key":"Worksheet"}</div>`);
    box.appendChild(sh);
  }
}
$("wsBtn").onclick=()=>{wsKey=false;view("ws");renderWs(true);};
$("wsBack").onclick=goHome;
$("wsNew").onclick=()=>renderWs(true);
$("wsKey").onclick=()=>{wsKey=!wsKey;renderWs(false);};
$("wsBasic").onclick=()=>{st.level="basic";renderWs(true);};
$("wsAdv").onclick=()=>{st.level="adv";renderWs(true);};
$("wsPrint").onclick=()=>window.print();

/* ---------- modal ---------- */
function modal(html){$("modal").innerHTML=html;$("ov").classList.remove("hide");}
$("ov").onclick=e=>{
  const a=e.target.closest("[data-a]");
  if(e.target===$("ov")||a){$("ov").classList.add("hide"); if(a){ if(a.dataset.a==="mix")startMix(); if(a.dataset.a==="home")goHome(); }}
};
$("helpBtn").onclick=()=>modal(`<h2>How to use</h2><ol>
  <li>Choose a verb picture.</li>
  <li>Choose a form (Positive, Negative, Question) and a tense.</li>
  <li>Use the word chips to say the full sentence about the photo.</li>
  <li>Press <b>Show answer</b> to check and listen.</li></ol>
  <p><b>Basic</b> has 4 tenses, <b>Advanced</b> adds Present Perfect and Past Continuous. <b>Mixed Review</b> gives 10 random verbs with a ready task. <b>Worksheet</b> makes a printable set with an answer key.</p>
  <p class="small">If a photo does not fit, press “Another photo” on the card. Photos: Unsplash.</p>
  <div class="mrow"><button data-a="close">OK</button></div>`);
$("tabs").onclick=e=>{const b=e.target.closest("button"); if(!b)return; st.tab=+b.dataset.i; renderTabs(); renderGrid();};
document.addEventListener("keydown",e=>{
  if($("cardv").classList.contains("hide")||!$("ov").classList.contains("hide")) return;
  if(e.key==="ArrowRight")$("next").click(); if(e.key==="ArrowLeft")$("prev").click();
});

/* optional: ?lv=adv, ?tab=2 */
const q=new URLSearchParams(location.search);
if(q.get("lv")==="adv") st.level="adv";
if(q.get("tab")) st.tab=Math.min(2,Math.max(0,(+q.get("tab")||1)-1));
renderTabs(); renderGrid();
</script>
