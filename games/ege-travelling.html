<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ЕГЭ · Английский язык · Тренажёр</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#1d2433;--mute:#5d677a;--line:#cfd6e2;--pri:#1f4e8c;--pri2:#e8eef8;--ok:#1b7f4b;--okbg:#e2f5ea;--bad:#b3261e;--badbg:#fde8e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171f;--card:#1b2230;--ink:#e6eaf2;--mute:#9aa6bb;--line:#33405a;--pri:#7fb0f0;--pri2:#223350;--ok:#6fd49a;--okbg:#17352a;--bad:#ff8f86;--badbg:#3d1f1d}}
:root[data-theme="dark"]{--bg:#12171f;--card:#1b2230;--ink:#e6eaf2;--mute:#9aa6bb;--line:#33405a;--pri:#7fb0f0;--pri2:#223350;--ok:#6fd49a;--okbg:#17352a;--bad:#ff8f86;--badbg:#3d1f1d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Georgia,"Times New Roman",serif}
header{background:#1f4e8c;color:#fff;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font:700 18px/1.2 Arial,sans-serif;margin:0}header small{font:13px Arial,sans-serif;opacity:.9}
.wrap{display:flex;gap:16px;max-width:1100px;margin:0 auto;padding:16px;align-items:flex-start}
nav{width:260px;flex:none;background:var(--card);border:1px solid var(--line);border-radius:4px;position:sticky;top:8px;font-family:Arial,sans-serif}
nav h3{margin:0;padding:8px 12px;font-size:13px;background:var(--pri2);color:var(--pri);border-bottom:1px solid var(--line)}
nav button{display:flex;justify-content:space-between;gap:6px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);padding:9px 12px;font:14px Arial,sans-serif;cursor:pointer}
nav button.on{background:var(--pri);color:var(--card)}
:focus-visible{outline:3px solid #f0a020;outline-offset:1px}
.badge{font-size:12px}#total{padding:10px 12px;font:700 14px Arial,sans-serif}
main{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:20px 22px}
main h2{font:700 20px/1.3 Arial,sans-serif;margin:0 0 4px}.sec{font:13px Arial,sans-serif;color:var(--mute);margin-bottom:12px}
.ins{background:var(--pri2);border-left:4px solid var(--pri);padding:10px 14px;margin:10px 0;font:15px/1.5 Arial,sans-serif}
.opts{border:1px solid var(--line);padding:8px 14px;margin:10px 0;font:15px Arial,sans-serif;columns:2}.opts div{break-inside:avoid}
.txt p{margin:0 0 12px}.box{border:1px solid var(--ink);padding:12px 14px;margin:10px 0}
img{max-width:100%;height:auto;border:1px solid var(--line)}
table{border-collapse:collapse;font:15px Arial,sans-serif}td,th{border:1px solid var(--line);padding:4px 12px}
select,input[type=text]{font:15px Arial,sans-serif;border:1px solid var(--line);border-radius:3px;padding:3px 6px;background:var(--card);color:var(--ink);margin:0 3px;max-width:100%}
input[type=text]{width:130px}
select.ok,input.ok{background:var(--okbg);border-color:var(--ok)}select.bad,input.bad{background:var(--badbg);border-color:var(--bad)}
.kw{font:12px Arial,sans-serif;color:var(--mute)}
.bar{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}
.btn{font:700 14px Arial,sans-serif;border:1px solid var(--pri);background:var(--pri);color:var(--card);padding:9px 16px;border-radius:3px;cursor:pointer}
.btn.alt{background:none;color:var(--pri)}.btn:disabled{opacity:.5}
.res{font:700 15px Arial,sans-serif}
textarea{width:100%;min-height:150px;font:15px/1.5 Georgia,serif;border:1px solid var(--line);border-radius:3px;padding:10px;background:var(--card);color:var(--ink)}
.cnt{font:14px Arial,sans-serif;color:var(--mute)}.cnt.good{color:var(--ok)}.cnt.warn{color:var(--bad)}
.model{background:var(--okbg);border:1px solid var(--ok);padding:10px 14px;margin-top:10px;font-size:15px;white-space:pre-wrap}
.chk label{display:block;font:15px Arial,sans-serif;margin:4px 0}
.stage{border:2px solid var(--pri);border-radius:6px;padding:14px;text-align:center;font-family:Arial,sans-serif;margin:12px 0}
#st{font-weight:700;font-size:17px}#cd{font-size:52px;font-weight:700;line-height:1.2}
.pb{height:8px;background:var(--pri2);border-radius:4px;overflow:hidden}#bar{height:100%;width:0;background:var(--pri)}
@media(max-width:760px){.wrap{flex-direction:column;padding:10px}nav{width:100%;position:static}main{padding:14px}.opts{columns:1}}
</style></head><body>

const SC=[["A","Hello! Windsor Travel company. How may I help you?"],["B","Hello, I was just wondering if you could offer me a tour of Windsor. This is my first visit to England and I want to make the most of it. I've been dreaming of visiting Windsor for quite a long time."],["A","You have phoned the very right place. We're the oldest company in Great Britain to offer a variety of guided tours to Windsor."],["B","So you have several routes? I'm surprised to hear that, as I thought Windsor's a really tiny town."],["A","Windsor isn't big but there's so much to see and do there. Would you like me to list some of the opportunities?"],["B","Yes, please."],["A","Well, the most famous attraction is certainly the magnificent Windsor Castle. When the Queen is in residence, her presence is marked by the flying of her personal standard from the Round Tower. You may be lucky to see that."],["B","I guess Windsor Castle is a must for a tourist like me. What can I see there?"],["A","First, you go to Saint George's Chapel, and move forward to Queen Mary's Dolls' House, a perfect miniature palace with working lights and lifts."],["B","That must be amazing! Anything else I could see apart from Windsor Castle?"],["A","You may stroll to the Household Cavalry Museum. Inside there is a comprehensive collection of the regiments' uniforms, weapons and armour. One more thing absolutely worth seeing is Windsor Great Park and Smith's Lawn."],["B","Is it possible to combine all these things into one day's tour?"],["A","Most people feel one day isn't enough for them. But you'll have a general impression and can come back next time you're in England."],["B","And what about shopping opportunities? I'd really love to buy some souvenirs for my family and friends."],["A","Windsor Royal Station will suit you. The covered shopping area combines modern store design and user-friendly facilities."],["B","Good. I think I'll order a tour now."]];
const Q3=["Why is it good to travel to different places? Do you travel much? Why or why not?","Where have you travelled to, at home or abroad? What did you do there?","What is your dream place to visit in 10 years' time? Why would you like to go there?","Has anyone you know travelled to a strange or interesting place? What was it?","Why is travel easier today than it used to be? What are some of the disadvantages of travelling nowadays?"];
const M3=["I believe travelling broadens people's horizons. Personally, I don't travel much because my parents don't give me a lot of money to spend on travelling.","In my country I've travelled to Crimea. I had a nice camping trip there. I've also visited France, Italy and Germany and did a lot of sightseeing.","I would like to visit Australia. It is far away and the flight is long and expensive. I'll save enough money and go to see kangaroos in nature.","A friend of mine went to America last summer. I think it's a very interesting place because it's on a different continent.","I guess it's easier because air fares have got quite affordable. However, it has got much more difficult to get visas, which is a major disadvantage."];

text:`<p>A. The tourist has visited England before. {0}</p><p>B. There is a number of sightseeing attractions in Windsor besides Windsor Castle. {1}</p><p>C. The tourist hopes to see the Queen in Windsor. {2}</p><p>D. The Household Cavalry Museum occupies a part of Windsor Castle. {3}</p><p>E. The tourist wants to see Windsor Great Park on a separate day. {4}</p><p>F. The receptionist claims that most tourists need more than one day to spend in Windsor. {5}</p><p>G. The tourist wants to buy postcards with the town views. {6}</p>`,ans:["2","1","3","2","2","1","3"]},
{s:"Раздел 2. Чтение",id:"r1",n:"Задание 10 (заголовки)",type:"sel",ch:["1","2","3","4","5","6","7","8"],
ins:"Установите соответствие между текстами A–G и заголовками 1–8. Используйте каждую цифру только один раз. Один заголовок лишний.",
opts:["1. Named after a politician","2. Too lengthy to stay","3. In hope for a good future","4. Named after a tsar","5. Modern pronunciation","6. Named after the river","7. Named after a wrong person","8. Bringing back the first name"],
text:`<p>{0} <b>A.</b> One local legend claims that the city of Orlando is named after the character in Shakespeare's "As You Like It", but the more commonly accepted version is that a man named Orlando Reeves owned a plantation and a sugar mill a bit north of what later became the city. Early settlers found where Reeves had carved his name in a tree and thought that it was a grave marker to a soldier, a hero who died in the Seminole War and mistakenly named their settlement after him.</p>
<p>{1} <b>B.</b> When Arizona city began expanding in the late 1860s, settlers realized that their little town needed a name. The founder of the city Jack Swilling, a Confederate veteran, wanted to name the town Stonewall in honour of Stonewall Jackson, but Darrell Duppa found out that their site had been a Native American settlement centuries earlier. He offered the name Phoenix. He believed that their new city would rise from the ruins of the former civilization like the legendary bird.</p>
<p>{2} <b>C.</b> In 1788, Captain Arthur Phillip discovered a supply of fresh water for his thirsty armada in a cave near Port Jackson, today's Sydney Harbor. Later he started a settlement there. The place needed a name. Though originally he had planned to name his new freshwater-filled settlement Albion – a poetic name for England – instead he decided to call the bay Sydney Cove after the Secretary of State, Lord Sydney. The fact that the guy had never even set foot in Australia didn't stop him.</p>
<p>{3} <b>D.</b> The Russian capital sits on the Moskva River, which is obviously where the city's name comes from. However, there are a couple of theories as to where the name Moskva comes from. The first states that it is a derivative of a Finno-Ugric name meaning river of either cows, or bears, or darkness. Nobody is really sure which of the three exactly, but all of them seem quite possible. The other, more popular theory, says that the name comes from a Slavic word meaning dank, swampy river.</p>
<p>{4} <b>E.</b> It's widely known that the City of Angels got its name from Spanish settlers. The beauty of the place impressed them so much that they considered it heaven on Earth. The original name, however, was a lot longer: El Pueblo de Nuestra Senora la Reina de los Angeles de Porcincula, or "The Town of Our Lady the Queen of Angels of the Little Portion". They realized there would be a lot of letters to fit on a hat they wore, so they just shortened it to Los Angeles.</p>
<p>{5} <b>F.</b> Have you ever wondered why in a restaurant we never order Beijing duck, but instead call it Peking like our grandmas did? Well, since Chinese characters don't much lend themselves to transliteration, English interpretations of how the name is pronounced have changed over the years. The name was given to the city during the Ming Dynasty by Zhu Di, who moved his capital there. "Beijing" is about as close as we can get now to saying it like the Chinese.</p>
<p>{6} <b>G.</b> St. Petersburg was founded on May 16, 1703, when the foundation of the Peter and Paul Fortress was laid. Since its foundation, the city's name has changed several times. Originally, it was named after the Apostle Peter as tsar Peter, the Apostle's namesake, relied on this saint's patronage. For a decade in the 1900's it was called Petrograd. This was from 1914–1924. After Lenin died, Petrograd was renamed Leningrad. St. Petersburg resumed its original name in 1992.</p>`,ans:["7","3","1","6","2","5","8"]},

text:`<p>Madagascar is a very large island off the southeast coast of Africa. It offers a variety of A {0} to arid deserts and golden sandy beaches. Most of Madagascar's inhabitants are thought to be originally from Asia and Africa, but mainly from Malayo-Polynesia.</p>
<p>Early separation from the African continent B {1}, so it now has species that exist nowhere else on Earth. This place differs from any other countries in the world. The length of its coastline is 5000 km. The unique biodiversity of the island has led to it being referred to as "the land that time forgot".</p>
<p>The Masoala region in the north of the country is Madagascar's largest protected area C {2}. It is home to a diverse array of creatures. Lemurs are the most recognisable creatures. They are unique to Madagascar. Around 100 species exist there, including the red-ruffed lemur, D {3}.</p>
<p>No trip to Madagascar would be complete without seeing the towering national tree of the country, the baobab tree. These strangely-shaped trees will leave a lasting impression on you. Often known as the "upside down tree" E {4}, the baobab has given rise to many legends. There is no doubt the baobabs are a magical sight.</p>
<p>The culture of the country reflects the origins of the Malagasy people. It is also influenced by F {5} settlers in the country.</p>`,ans:["4","2","1","5","6","3"]},
{s:"Раздел 2. Чтение",id:"r3",n:"Задания 12–18 (выбор ответа A–D)",type:"sel",ch:["A","B","C","D"],ins:"Прочитайте текст «Travel Writing» (в задании 32–38) ещё раз. Для вопросов 1–7 выберите ответ A, B, C или D.",text:`<p><b>1. What is one of the best ways to make your trip unforgettable?</b> {0}<br>A. Making a list of things to visit; B. Writing a travel diary; C. Submitting your memories online; D. Talking to the locals;</p><p><b>2. What can the locals recommend?</b> {1}<br>A. Places to visit that are usually hidden from tourists; B. Items to buy at gift shops; C. Things to avoid in the area; D. Tourist traps to check out;</p><p><b>3. What can you include in your travel diary?</b> {2}<br>A. Details about the places you visited; B. Your grocery list; C. A list of TV shows you watched; D. Your to-do list for the next day;</p><p><b>4. What can making a list of things to visit help you do?</b> {3}<br>A. Plan for every situation; B. Ensure that you miss out on something important; C. Organize your time better; D. Make your trip less enjoyable;</p><p><b>5. What can happen during traveling?</b> {4}<br>A. Everything can be planned for; B. It can be boring and predictable; C. It can be an opportunity to explore something else; D. It can be limited to what you can see in guidebooks;</p><p><b>6. What can submitting your memories online do?</b> {5}<br>A. Help you forget about your trip; B. Help you relive your experiences; C. Make your memories less important; D. Discourage others from traveling;</p><p><b>7. What is the final reminder in the text?</b> {6}<br>A. Take as many pictures as possible; B. Plan for everything in advance; C. Enjoy your trip and savor every moment; D. Stress about documenting every experience;</p>`,ans:["D","A","A","C","C","B","C"]},

text:`<p><b>Visiting Uluru.</b> Thousands of {0} <span class="kw">VISIT</span> to Australia go to see Uluru. Some believe it is the largest monolith in the world, but this title is {1} <span class="kw">ACTUAL</span> held by Mount Augustus. Its colours can change in subtle {2} <span class="kw">DIFFER</span> when it rains, and the view undergoes amazing {3} <span class="kw">TRANSFORM</span> at sunset. The surface is full of {4} <span class="kw">USUAL</span> caves and holes. Uluru is sacred to the indigenous people, and guides {5} <span class="kw">COURAGE</span> tourists from climbing the rock.</p><p><b>The Blue Mountains.</b> If you are a {6} <span class="kw">VISIT</span> to Australia, try this {7} <span class="kw">AMAZE</span> park. It is {8} <span class="kw">PROBABLE</span> best known for the Three Sisters. It is also a popular {9} <span class="kw">NATURE</span> playground; the top sport is rock {10} <span class="kw">CLIMB</span>. Your day there will certainly be {11} <span class="kw">FORGET</span>.</p>`,
ans:["visitors","actually","differences","transformations","unusual","discourage","visitor","amazing","probably","natural","climbing","unforgettable"]},

text:`<p><b>Travel Writing: How to Make Your Trips Memorable</b></p>
<p>Traveling can be an unforgettable experience, but how can we make sure that we {0} all the highlights of our trip? Here are some tips that can help you document and relive your adventures:</p>
<p>{1} to the locals: One of the best ways to make your trip unforgettable is by communicating with the locals. They can provide you with valuable information about their culture, history, and traditions, and give you insights that you would never find in guidebooks. Moreover, locals can recommend places to eat, visit, and stay that are off the beaten path, which can {2} to the uniqueness of your trip.</p>
<p>Write a travel diary: Writing a travel diary is an excellent way to remember your experiences, emotions, and thoughts during your trip. You can include details about the places you visited, the people you met, and the food you ate. By writing down your memories, you can relive them later, and share them with others who are interested in your journey.</p>
<p>{3} a list of things to visit: Before you set off on your trip, list all the things you want to see and do. This will help you organize your time better, and ensure that you don't miss out on anything important. If you have limited time, prioritize the things that are most important to you, and leave the less essential things for another time.</p>
<p>{4}, expect the unexpected: Traveling can be unpredictable, and it's impossible to plan for everything. {5}, by being open to new experiences, you can make the most of every situation. If you miss out on something, don't be too hard on yourself. Use it as an opportunity to explore something else, or plan a return trip to the same location in the future.</p>
<p>{6} your memories online: Once you've returned from your trip, you can create a blog or share your photos on social media. This can not only help you relive your experiences but also inspire others to travel and explore new places.</p>
<p>{7} yourself to savor every moment: Finally, remember to enjoy your trip, and savor every moment. Don't worry too much about taking pictures or documenting every experience. Instead, take the time to immerse yourself in the present moment, and create memories that will last a lifetime.</p>`,ans:["4","1","4","3","4","3","1","1"]},
{s:"Раздел 4. Письмо",id:"wr",n:"Задание 37 (электронное письмо)",type:"write",min:100,max:140,
ins:"Вы получили письмо от британского друга по переписке Pete. Напишите ответ (100–140 слов): ответьте на его вопросы и задайте 3 вопроса о его котёнке.",
text:`<div class="box" style="font-style:italic">From: Pete@mail.uk · To: Russian_friend@ege.ru · Subject: Last summer<br>… I've just been to Scotland. That was unbelievable! … Where did you spend your last summer? What did you like most about it? Which country would you like to visit one day, and why? … My parents bought me a kitten for my birthday! …</div>`,
chk:["Поблагодарил(а) за письмо, есть вежливая фраза в начале","Ответил(а) на все три вопроса Pete","Задал(а) 3 прямых вопроса о котёнке","Есть завершающая фраза, прощание и подпись","Объём 100–140 слов","Нет грамматических и орфографических ошибок"],
model:`Dear Pete,\nThanks for your email. I'm glad to hear from you again.\nIn your email you asked me about last summer. I spent it in Greece. I visited my aunt there. Most of all I liked the sea and the food. One day, I would like to visit Australia. I really want to see kangaroos in nature.\nGreat news about your kitten! What is its name? What breed is it? Is it three months old?\nSorry, I need to go now to help my mom. Hope to hear from you soon.\nBest wishes,\nSofia`},
{s:"Раздел 4. Письмо",id:"es",n:"Задание 38 (эссе по таблице)",type:"write",min:200,max:250,
ins:"Вы делаете проект о популярных видах транспорта в Zetland. Прокомментируйте данные таблицы и выскажите мнение (200–250 слов). План: вступление; 2–3 факта; 1–2 сравнения; проблема при использовании общественного транспорта и её решение; заключение с вашим мнением.",
text:`<table><tr><th>Means of transport</th><th>Respondents (%)</th></tr><tr><td>Bicycle</td><td>55</td></tr><tr><td>Car</td><td>15</td></tr><tr><td>Bus</td><td>13</td></tr><tr><td>Scooter</td><td>10</td></tr><tr><td>Motorbike</td><td>7</td></tr></table>`,
chk:["Есть вступление по теме проекта","Приведены 2–3 факта из таблицы","Есть 1–2 сравнения с комментарием","Названа проблема и предложено решение","Есть заключение с аргументированным мнением","Объём 200–250 слов, логичные связки, нет ошибок"],
model:`People use different means of transport to move in cities depending on their needs. I am currently doing a project on popular means of transport in Zetland. I have found a table with some results of relevant opinion polls.\nAccording to the table, the majority of the respondents ride a bike in Zetland (55%). 15% of those surveyed use a car. Only one tenth of the people ride a scooter (10%).\nInterestingly, approximately twice as many of the respondents go by bus (13%) as those who prefer to ride a motorbike (7%). Riding a motorbike could be dangerous, which is probably why it is the least favourable option.\nUsing public transport is very convenient but there is a problem that can arise. It is usually much too overcrowded, especially in rush hours. To tackle the problem, one should use early or late buses or trains to avoid being surrounded by many people.\nIn conclusion, I believe that public transport is of utmost importance in cities. It helps reduce traffic because many people can use one vehicle. It also helps to get to work or school faster because of fixed lines and trains that run on schedule.`},

mat:`<div class="box">For some years now work has been in progress on the new motorway connecting the heavily populated industrial Midlands to the holiday resorts on the coasts of South West England. The general increase in traffic density, and in particular the mass migration of holiday makers who flock to the south every July and August in search of a fortnight's peace at the seaside, has strained the old road system beyond its limits. Car drivers frequently have to endure hours of waiting in long queues of vehicles before finally crawling to their destinations. Some sections of the new motorway are already in use, and soon half of this much-needed stretch of tarmac will be open to traffic. Before the end of next year, the numerous construction gangs engaged in this work will have completed the entire project; and at last, there will be peace for the inhabitants of the countless villages and small towns along the narrow, winding old roads.</div>`,

ins:"Вы с другом делаете проект «Ways of having a holiday». Оставьте голосовое сообщение: подготовка 1,5 мин, ответ до 3 минут (12–15 предложений), говорить нужно непрерывно.",

mod:"Hi Sveta, I've found two excellent pictures for our project 'Ways of having a holiday' and I'd like to tell you about them. I believe the pictures are perfectly suitable as they both show people on holiday. In the first picture, there's a woman on the coast of the sea or the ocean. She's posing for a photo and she has a nice tan. In the second picture, I can see a man near a tent and a table. Perhaps, he's having a camping trip. There is a noticeable difference between the pictures. The woman seems to be relaxed, she isn't doing anything. The man, on the other hand, has probably just cooked something. It requires some work to do.\nThere are some advantages of the two ways of having a holiday. If you relax near the beach, you can forget about everything. All things are usually done for you. If you have a camping holiday, you can choose a place and enjoy some peace and quiet.\nUnfortunately, both ways have their disadvantages. A beach holiday is usually very expensive. As for camping, mosquitoes can bite you and it is really annoying.\nPersonally, I would like to have a holiday in a tent. I've never tried it before and I think it'll be a lot of fun with my friends. That's all for now. Call me back and tell me what you think about the pictures. Bye."}
];
const $=s=>document.querySelector(s),sc={};let cur=0,abort=false,plays=0;
const norm=s=>s.toLowerCase().replace(/[’`]/g,"'").replace(/\s+/g," ").trim(),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
function nav(){let h="",last="";T.forEach((t,i)=>{if(t.s!==last){h+=`<h3>${t.s}</h3>`;last=t.s}h+=`<button data-i="${i}" class="${i==cur?'on':''}">${t.n}<span class="badge">${sc[t.id]||''}</span></button>`});
let g=0,m=0;Object.values(sc).forEach(b=>{const[x,y]=b.split("/");g+=+x;m+=+y});h+=`<div id="total">Автопроверка: ${g} из ${m||'–'}</div>`;$("#nav").innerHTML=h}
function ctl(t,i){if(t.type=="fill")return`<input type="text" data-i="${i}" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Пропуск ${i+1}">`;
const o=t.chs?t.chs[i].map((w,k)=>`<option value="${k+1}">${k+1} ${w}</option>`):t.ch.map((c,k)=>`<option value="${c}">${t.lab?c+' '+t.lab[k]:c}</option>`);
return`<select data-i="${i}" aria-label="Пункт ${i+1}"><option value="">–</option>${o.join("")}</select>`}
function show(i){speechSynthesis&&speechSynthesis.cancel();abort=true;plays=0;cur=i;const t=T[i];let h=`<div class="sec">${t.s}</div><h2>${t.n}</h2><div class="ins">${t.ins}</div>`;
if(t.listen)h+=`<div class="bar"><button class="btn" id="pl">▶ Прослушать диалог (осталось 2)</button><span class="res" id="pls"></span></div>`;
if(t.opts)h+=`<div class="opts">${t.opts.map(o=>`<div>${o}</div>`).join("")}</div>`;
if(t.text)h+=`<div class="txt">${t.text.replace(/\{(\d+)\}/g,(m,k)=>t.ans?ctl(t,+k):"")}</div>`;
if(t.ans)h+=`<div class="bar"><button class="btn" id="chk">Проверить</button><button class="btn alt" id="ans">Показать ответы</button><button class="btn alt" id="rst">Сбросить</button><span class="res" id="res"></span></div>`;
if(t.listen)h+=`<div class="bar"><button class="btn alt" id="scr">Показать текст записи</button></div><div id="sct"></div>`;
if(t.type=="write")h+=`<textarea id="ta" aria-label="Ваш ответ"></textarea><div class="cnt" id="cnt">0 слов (нужно ${t.min}–${t.max})</div><div class="chk"><p><b>Самопроверка по критериям:</b></p>${t.chk.map(c=>`<label><input type="checkbox"> ${c}</label>`).join("")}</div><div class="bar"><button class="btn alt" id="mod">Показать образец</button></div><div id="mdl"></div>`;
if(t.type=="speak")h+=`${t.mat||""}<div class="stage"><div id="st">Готовы? Нажмите «Начать». Разрешите микрофон для записи ответа.</div><div id="cd">–</div><div class="pb"><div id="bar"></div></div></div><div class="bar"><button class="btn" id="go">Начать</button><button class="btn alt" id="stp">Остановить</button></div><div id="au"></div><div class="bar"><button class="btn alt" id="mo">Показать вопросы и образец</button></div><div id="mdl"></div>`;
$("#main").innerHTML=h;nav();bind(t)}
function say(txt,pitch=1){return new Promise(res=>{if(!window.speechSynthesis)return res();const u=new SpeechSynthesisUtterance(txt);u.lang="en-GB";u.rate=.92;u.pitch=pitch;u.onend=res;u.onerror=res;speechSynthesis.speak(u);setTimeout(res,30000)})}
function beep(){try{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();setTimeout(()=>{o.stop();a.close()},350)}catch(e){}}
function mdl(txt){$("#mdl").innerHTML='<div class="model"></div>';$("#mdl").firstChild.textContent=txt}
async function run(t){abort=false;const st=$("#st"),cd=$("#cd"),bar=$("#bar");$("#go").disabled=true;$("#au").innerHTML="";let mr=null,ch=[];
try{const s=await navigator.mediaDevices.getUserMedia({audio:true});mr=new MediaRecorder(s);mr.ondataavailable=e=>ch.push(e.data);mr.start()}catch(e){}
for(const p of t.steps){if(abort)break;st.textContent=p.l;
if(p.say){cd.textContent="🔊";bar.style.width="0";speechSynthesis.cancel();await say(p.say,1.1)}
if(p.s){if(p.rec)beep();for(let s=p.s;s>=0&&!abort;s--){cd.textContent=fmt(s);bar.style.width=(100*(p.s-s)/p.s)+"%";await sleep(1000)}if(p.rec&&!abort)beep()}}
st.textContent=abort?"Остановлено":"Готово. Прослушайте свою запись и сверьтесь с образцом.";cd.textContent="–";$("#go").disabled=false;
if(mr){mr.onstop=()=>{if(ch.length){const a=document.createElement("audio");a.controls=true;a.src=URL.createObjectURL(new Blob(ch));$("#au").innerHTML="<p><b>Ваша запись:</b></p>";$("#au").appendChild(a)}mr.stream.getTracks().forEach(x=>x.stop())};mr.stop()}}
async function play(){if(plays>=2)return;plays++;const b=$("#pl");b.disabled=true;$("#pls").textContent="Идёт запись…";abort=false;
for(const[w,x]of SC){await say(x,w=="A"?1.25:.85);await sleep(300)}
b.disabled=plays>=2;b.textContent="▶ Прослушать диалог (осталось "+(2-plays)+")";$("#pls").textContent=""}
function bind(t){
if(t.listen){$("#pl").onclick=play;$("#scr").onclick=()=>{$("#sct").innerHTML='<div class="model"></div>';$("#sct").firstChild.textContent=SC.map(x=>x[0]+": "+x[1]).join("\n")}}
if(t.type=="write"){const ta=$("#ta"),c=$("#cnt");ta.oninput=()=>{const n=(ta.value.match(/\S+/g)||[]).length;c.textContent=n+" слов (нужно "+t.min+"–"+t.max+")";c.className="cnt "+(n>=t.min*.9&&n<=t.max*1.1?"good":"warn")};$("#mod").onclick=()=>mdl(t.model)}
if(t.type=="speak"){$("#go").onclick=()=>run(t);$("#stp").onclick=()=>{abort=true;speechSynthesis.cancel()};$("#mo").onclick=()=>mdl(t.mod||"Для этого задания образца нет: прослушайте свою запись и проверьте беглость и чёткость чтения.")}
if(!t.ans)return;const els=()=>[...document.querySelectorAll("#main [data-i]")];
$("#chk").onclick=()=>{let ok=0;els().forEach(e=>{const r=t.ans[e.dataset.i].split("|").map(norm).includes(norm(e.value));e.className=r?"ok":"bad";if(r)ok++});sc[t.id]=ok+"/"+t.ans.length;$("#res").textContent="Верно: "+ok+" из "+t.ans.length;nav()};
$("#ans").onclick=()=>{els().forEach(e=>{e.value=t.ans[e.dataset.i].split("|")[0];e.className="ok"});$("#res").textContent="Ответы показаны (баллы не засчитаны)";delete sc[t.id];nav()};
$("#rst").onclick=()=>{els().forEach(e=>{e.value="";e.className=""});$("#res").textContent="";delete sc[t.id];nav()}}
$("#nav").onclick=e=>{const b=e.target.closest("button");if(b)show(+b.dataset.i)};
$("#th").onclick=()=>{const r=document.documentElement;r.dataset.theme=getComputedStyle(r).getPropertyValue("--bg").trim()=="#12171f"?"light":"dark"};
show(0);
</script></body></html>
