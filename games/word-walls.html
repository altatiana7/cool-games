<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Walls</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fbf1dc;--card:#fffaf0;--ink:#3a2412;--acc:#d9731a;--acc2:#a8480c;--line:#3a2412;--brick:#8a3a22}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1d12;--card:#3a281a;--ink:#fbeed6;--line:#e8c9a0}}
:root[data-theme="dark"]{--bg:#2a1d12;--card:#3a281a;--ink:#fbeed6;--line:#e8c9a0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;min-height:100vh}
#app{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:44px;margin:4px 0;color:var(--acc);text-align:center;letter-spacing:1px}
.sub{text-align:center;opacity:.75;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.opt{background:var(--card);border:2px solid transparent;border-radius:16px;padding:14px 20px;font-size:18px;font-weight:700;cursor:pointer;color:var(--ink);min-width:120px}
.opt.on{border-color:var(--acc);background:linear-gradient(135deg,#fde3bd,var(--card));color:#3a2412}
.btn{background:var(--acc);color:#fff;border:0;border-bottom:5px solid var(--acc2);border-radius:14px;padding:14px 32px;font-size:20px;font-weight:800;cursor:pointer}
.btn:active{transform:translateY(2px)}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.pill{background:var(--card);border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer;border:1px solid rgba(0,0,0,.1);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.tile{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:14px 4px;font-size:20px;font-weight:800;text-align:center;cursor:pointer;color:var(--ink)}
.tile.hint{border-color:var(--acc);box-shadow:0 0 0 3px #f5a54a}
.tile.bad{animation:sh .4s;background:#f6b5a8;color:#3a2412}
.tile.ok{visibility:hidden}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.wl{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:#5a2314;padding:6px;border-radius:10px;margin-bottom:12px}
.slot{min-height:42px;border:2px dashed rgba(255,255,255,.25);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px}
.slot.full{border:0;background:linear-gradient(135deg,#c4552f,#8a3a22);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);animation:drop .35s}
@keyframes drop{from{transform:translateY(-30px);opacity:0}}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:12px 0}
.brick{background:linear-gradient(135deg,#b4492a,var(--brick));border-radius:10px;padding:6px;cursor:pointer;box-shadow:0 3px 0 #5a2314}
.brick div{background:#3a2012;border-radius:8px;padding:10px 6px;text-align:center;color:#fff;min-height:96px}
.brick b{font-size:22px;display:block}.brick span{font-size:13px;color:#ffe2bd}
.scene{display:grid;grid-template-columns:200px 1fr;gap:12px}
@media(max-width:640px){.scene{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.chip{background:var(--card);border:2px solid var(--acc);border-radius:20px;padding:6px 12px;font-weight:700;cursor:pointer;color:var(--ink)}
.chip.sel{background:var(--acc);color:#fff}
.bld{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#1d2440;padding:8px;border-radius:12px}
.room{background:#f6d58f;border-radius:6px;aspect-ratio:1.5;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:44px;cursor:pointer;color:#3a2412}
.room:nth-child(3n+2){background:#a9c3e8}.room:nth-child(3n){background:#e2b8d4}
.room small{font-size:14px;font-weight:800;min-height:18px}
.room.bad{animation:sh .4s}
.msg{text-align:center;font-size:24px;font-weight:800;margin:30px 0}
.tile{background:none;border:0;padding:0;perspective:700px;min-height:96px;visibility:visible}
.tile.ok,.tile.bad,.tile.hint{visibility:visible;background:none;box-shadow:none}
.fl{position:relative;width:100%;height:100%;min-height:96px;transition:transform .6s;transform-style:preserve-3d}
.tile.ok .fl{transform:rotateY(180deg)}
.fa,.fb{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;text-align:center;padding:4px}
.fa{background:var(--card);border:2px solid var(--line);font-size:20px;font-weight:800}
.tile.hint .fa{border-color:var(--acc);box-shadow:0 0 0 3px #f5a54a}
.tile.bad .fa{background:#f6b5a8;color:#3a2412}
.fb{transform:rotateY(180deg);background:linear-gradient(135deg,#b4492a,#8a3a22);box-shadow:0 3px 0 #5a2314;color:#fff}
.fb b{font-size:22px}.fb span{font-size:12px;color:#ffe2bd;margin-top:2px}
.pic{position:relative;line-height:0}.pic img{width:100%;border-radius:12px;display:block}
.spot{position:absolute;cursor:pointer;border-radius:6px;display:flex;align-items:flex-end;justify-content:center}
.spot:hover{background:rgba(255,255,255,.15)}
.spot small{background:#d9731a;color:#fff;font-weight:800;font-size:13px;line-height:1.2;padding:2px 8px;border-radius:10px;margin-bottom:4px;empty-cells:hide}.spot small:empty{display:none}
.spot.won{box-shadow:inset 0 0 0 3px #ffd34d}
.room.won{outline:3px solid #ffd34d}
.fx{position:absolute;pointer-events:none;overflow:hidden;z-index:50}
.fx i{position:absolute;top:-10px;width:8px;height:12px;animation:fall 1.4s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),500px) rotate(540deg)}}
.fx .em{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;animation:pop .8s}
@keyframes pop{from{transform:scale(0)}60%{transform:scale(1.4)}}
.fx .th{position:absolute;left:0;bottom:-10px;font-size:54px;display:flex;flex-direction:column;align-items:center;animation:crawl 1.5s ease-out forwards;line-height:1}
.fx .th small{font-size:13px;font-weight:800;background:#222;color:#fff;border-radius:8px;padding:2px 6px}
@keyframes crawl{0%{transform:translate(-20px,60px)}40%{transform:translate(40%,0) rotate(-12deg)}70%{transform:translate(90%,0) rotate(10deg)}100%{transform:translate(300%,0)}}
</style></head><body><div id="app"></div>
<script>
const T={
feelings:{n:'Feelings',i:'💬',w:[['angry','wants to shout at someone','😡'],['bored','has nothing fun to do','🥱'],['calm','quiet, peaceful, not upset','🧘'],['excited','ready and full of energy','🤩'],['happy','smiling, things are going well','😄'],['hungry','stomach is empty, needs food','🍽️'],['jealous','wants what other people have','😒'],['nervous','worried about something coming soon','😬'],['proud','feels great about your success','🏆'],['sad','wants to cry, feels bad','😢'],['scared','afraid something bad will happen','😱'],['sleepy','needs rest, eyes are heavy','😴'],['surprised',"didn't expect what just happened",'😲'],['thirsty','needs water, throat feels dry','🥤'],['tired','needs to rest, feels weak','😩']]},
weather:{n:'Weather',i:'⛅',w:[['sunny','the sun is shining','☀️'],['rainy','water falls from the sky','🌧️'],['cloudy','grey clouds cover the sky','☁️'],['windy','the air moves fast','💨'],['snowy','white flakes fall down','❄️'],['foggy','hard to see far away','🌫️'],['stormy','thunder, lightning, strong wind','⛈️'],['hot','very high temperature','🥵'],['cold','low temperature, you need a coat','🥶'],['warm','nice and not cold','☕'],['cool','a little cold, fresh','😎'],['wet','covered with water','🌂'],['dry','no water, no rain','🏜️'],['freezing','extremely cold, below zero','🧊'],['humid','air feels heavy and damp','💦']]},
money:{n:'Money & Value',i:'🪙',w:[['cheap','costs little money','🏷️'],['expensive','costs a lot of money','💎'],['rich','has a lot of money','🤑'],['poor','has very little money','🪙'],['free','you pay nothing','🎁'],['valuable','worth a lot','🖼️'],['wealthy','very rich, owns a lot','🏰'],['broke','has no money left','👛'],['generous','happy to give to others','🤝'],['priceless','too special to have a price','👑'],['worthless','has no value at all','🗑️'],['useful','helps you do things','🔧'],['useless','does not help at all','📻'],['rare','very few exist','🦄'],['fair','right price, honest','⚖️']]}};
const V='bake climb cook dance draw drink drive eat fly jump listen play read ride run sing swim talk walk wash write'.split(' ');
const H={practice:[Infinity,'∞'],standard:[5,'♥♥♥♥♥'],challenge:[3,'♥♥♥']};
let S={topic:'feelings',diff:'standard'};
const $=id=>document.getElementById(id),A=$('app');
const sh=a=>[...a].sort(()=>Math.random()-.5);
const say=w=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='en-US';speechSynthesis.speak(u)}catch(e){}};
function menu(){
A.innerHTML=`<div class="sub" style="margin:0">✦ ADJECTIVES · VOL. 2 ✦</div><h1>Word Walls</h1><div class="sub">Build your vocabulary, brick by brick</div>
<div class="row">${Object.entries(T).filter(([k])=>k=='feelings').map(([k,t])=>`<button class="opt ${S.topic==k?'on':''}" data-t="${k}">${t.i} ${t.n}</button>`).join('')}</div>
<div class="sub" style="letter-spacing:2px;font-size:12px">SELECT YOUR DIFFICULTY</div>
<div class="row">${Object.entries(H).map(([k,h])=>`<button class="opt ${S.diff==k?'on':''}" data-d="${k}">${k[0].toUpperCase()+k.slice(1)}<br><small>${h[1]}</small></button>`).join('')}</div>
<div class="row"><button class="btn" id="go">Start Building →</button></div>`;
A.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.topic=b.dataset.t;menu()});
A.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{S.diff=b.dataset.d;menu()});
$('go').onclick=build}
function build(){
const t=T[S.topic],D=Object.fromEntries(t.w.map(x=>[x[0],x[1]])),good=new Set(Object.keys(D));let lives=H[S.diff][0],found=0,hints=3;
const words=sh([...good,...sh(V).slice(0,15)]);
A.innerHTML=`<div class="top"><button class="pill" id="ex">← Exit</button><b>${t.n} · Adjectives</b><b id="cnt">0/15 bricks</b><span class="pill" id="hp"></span><button class="pill" id="hb">💡 <span id="hn">3</span></button></div>
<div class="sub" id="sb">Tap the adjectives that describe ${t.n.toLowerCase()} and they flip into a wall. Verbs are traps!</div>
<div class="grid">${words.map(w=>`<div class="tile" data-w="${w}"><div class="fl"><div class="fa">${w}</div><div class="fb"><b>${w}</b><span>${D[w]||''}</span></div></div></div>`).join('')}</div><div class="row" id="fin"></div>`;
const hp=()=>$('hp').textContent=lives===Infinity?'∞':'♥'.repeat(lives)+'♡'.repeat(H[S.diff][0]-lives);hp();
$('ex').onclick=menu;
$('hb').onclick=()=>{if(!hints)return;const el=[...A.querySelectorAll('.tile:not(.ok)')].find(e=>good.has(e.dataset.w));if(el){el.classList.add('hint');hints--;$('hn').textContent=hints}};
A.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{
const w=b.dataset.w;say(w);if(b.classList.contains('ok'))return;
if(good.has(w)){b.classList.add('ok');found++;$('cnt').textContent=found+'/15 bricks';
if(found==15)setTimeout(()=>{A.querySelectorAll('.tile:not(.ok)').forEach(e=>e.style.display='none');$('sb').innerHTML='<b style="color:var(--acc);font-size:22px">The wall stands.</b> Tap any brick to hear it pronounced.';$('fin').innerHTML='<button class="btn" id="sc">Reveal the scene →</button>';$('sc').onclick=scene},1000)}
else{b.classList.add('bad');setTimeout(()=>b.classList.remove('bad'),400);if(lives!==Infinity){lives--;hp();if(!lives)A.innerHTML=`<div class="msg">The wall fell down 💥<br>You found ${found}/15</div><div class="row"><button class="btn" id="r">Try again</button><button class="pill" id="m">Menu</button></div>`,$('r').onclick=build,$('m').onclick=menu}}})}
function wall(){
const t=T[S.topic];
A.innerHTML=`<div class="top"><div><small>${t.n.toUpperCase()}</small><h2 style="margin:0;color:var(--acc)">The wall stands.</h2></div><div class="sub" style="margin:0">Tap any brick to hear it pronounced.</div><button class="btn" id="sc">Reveal the scene →</button></div>
<div class="wall">${t.w.map(x=>`<div class="brick" data-w="${x[0]}"><div><b>${x[0]}</b><span>${x[1]}</span></div></div>`).join('')}</div>`;
A.querySelectorAll('.brick').forEach(b=>b.onclick=()=>say(b.dataset.w));$('sc').onclick=scene}

function fx(el,ok,box){
const r=el.getBoundingClientRect(),o=document.createElement('div');o.className='fx';o.style.cssText=`left:${r.left+scrollX}px;top:${r.top+scrollY}px;width:${r.width}px;height:${r.height}px`;
if(ok){for(let i=0;i<26;i++){const c=document.createElement('i');c.style.cssText=`left:${Math.random()*100}%;background:hsl(${Math.random()*360},90%,60%);animation-delay:${Math.random()*.3}s;--dx:${(Math.random()-.5)*80}px`;o.appendChild(c)}o.insertAdjacentHTML('beforeend','<span class="em">🎉🥳</span>')}
else o.insertAdjacentHTML('beforeend','<span class="th">🦹<small>Thief!</small></span>');
document.body.appendChild(o);setTimeout(()=>o.remove(),ok?1800:1600)}
function scene(){
const t=T[S.topic],pic=S.topic=='feelings';let sel=null,n=0;
const items=pic?t.w.map(x=>[x[0],SPOT[x[0]]]):sh(t.w).map(x=>[x[0],null,x[2]]);
A.innerHTML=`<div class="top"><b style="font-size:22px;color:var(--acc)">Find these words in the picture!</b><b id="fc">0 / 15 found</b></div>
<div class="scene"><div class="chips">${sh(t.w).map(x=>`<button class="chip" data-w="${x[0]}">${x[0]}</button>`).join('')}</div>
${pic?`<div class="pic"><img src="${IMG}" alt="">${items.map(([w,p])=>`<div class="spot" data-w="${w}" style="left:${p[0]}%;top:${p[1]}%;width:${p[2]}%;height:${p[3]}%"><small></small></div>`).join('')}</div>`
:`<div class="bld">${items.map(x=>`<div class="room" data-w="${x[0]}">${x[2]}<small></small></div>`).join('')}</div>`}</div>`;
A.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{A.querySelectorAll('.chip').forEach(e=>e.classList.remove('sel'));c.classList.add('sel');sel=c;say(c.dataset.w)});
A.querySelectorAll('.room,.spot').forEach(r=>r.onclick=()=>{
if(!sel||r.dataset.done)return;
if(sel.dataset.w===r.dataset.w){r.dataset.done=1;r.classList.add('won');r.querySelector('small').textContent=r.dataset.w;fx(r,1);sel.remove();sel=null;n++;$('fc').textContent=n+' / 15 found';
if(n==15)setTimeout(()=>{A.insertAdjacentHTML('beforeend',`<div class="msg">🎉 Well done!</div><div class="row"><button class="btn" id="m">Choose topic →</button><button class="pill" id="a">Play again</button></div>`);$('m').onclick=menu;$('a').onclick=build},900)}
else{fx(r,0)}})}
menu();
</script></body></html>
